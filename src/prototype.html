<title>Preahchan Tasks Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column with bottom navigation; left sidebar from 900px. Single light look, from the Preahchan Tasks design system. */
:root{
  --surface:#f7f4ec; --surface-raised:#ffffff; --ink:#14213d; --ink-muted:#55607a;
  --line:#cfc8b8; --line-strong:#8a8472; --brand:#14213d; --on-brand:#f7f4ec;
  --moon:#f2b632; --moon-soft:#fbe9b7; --done:#0b5f7a; --done-soft:#d9ecf2;
  --overdue:#a33f06; --overdue-soft:#fbe3d0;
  --prio-high:#b3261e; --prio-high-soft:#fbdcd8; --prio-normal:#3d4a6b; --prio-normal-soft:#e3e6ee; --prio-low:#2f6b3a; --prio-low-soft:#dcebd9;
  --note-yellow:#fbe9b7; --note-blue:#d9ecf2; --note-green:#dcebd9; --note-pink:#fbdcd8; --note-lilac:#e7e2f3; --note-white:#ffffff;
  --sans:"Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;
  --r-sm:6px; --r-md:12px; --r-lg:20px; --r-full:999px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font:400 15px/24px var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:40px;font-weight:700;text-wrap:balance}
h2{font-size:20px;line-height:30px;font-weight:600}
h3{font-size:17px;line-height:26px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--ink-muted)} .cap{font-size:12px;line-height:18px} .lab{font-size:13px;line-height:20px;font-weight:600}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:1080px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:28px;width:auto;display:block}
.top .sp{flex:1}
@media (max-width:599px){.top .sample{order:9}.top::after{content:"";order:8;flex-basis:100%;height:0}}
.sample{background:var(--moon-soft);border-radius:var(--r-full);padding:2px 12px;font-size:12px;line-height:18px}
.who{display:flex;align-items:center;gap:8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}

.btn{min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-raised);font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.small{min-height:36px;padding:0 12px}
.btn.danger{color:var(--overdue);border-color:var(--overdue)}

nav.nav{display:flex;flex-direction:column;gap:4px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px}
nav.nav button{min-height:44px;border:0;background:none;border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--ink-muted);cursor:pointer;text-align:left;padding:0 12px}
.navscrim{position:fixed;inset:0;z-index:14;background:rgba(20,33,61,.25)}
@media (max-width:899px){
  .shell{padding-block:16px 40px}
  nav.nav{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 72px);left:max(16px,env(safe-area-inset-left,0px));width:min(280px,calc(100% - 32px))}
  nav.nav:not(.openmenu){display:none}
}
nav.nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
main{display:flex;flex-direction:column;gap:24px;min-width:0}
@media (min-width:900px){
  .shell{padding-block:32px 48px}
  .body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
  nav.nav{position:static}
  .top .menubtn,.navscrim{display:none}
}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{flex:1;min-width:0}

.kpi{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.kpi .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .big{font-size:40px;line-height:44px;font-weight:700}
.badge{background:var(--moon);color:var(--ink);border-radius:var(--r-full);padding:2px 12px;font-size:13px;font-weight:600;line-height:20px}
.bar{height:8px;border-radius:var(--r-full);background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-full)}
.dots{display:flex;gap:12px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:18px;color:var(--ink-muted)}
.dots b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:block}
.dots b.on{background:var(--brand);border-color:var(--brand)}
.dots b.today{background:var(--moon);border-color:var(--ink)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:36px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:none;font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.list{display:flex;flex-direction:column;gap:12px}
.task{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.task .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:var(--r-sm)}
.task .open h3{overflow-wrap:anywhere}
.task>.btn{flex:none;align-self:center}
.task.isdone h3{text-decoration:line-through;color:var(--ink-muted)}
.check{width:28px;height:28px;margin-top:8px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface-raised);cursor:pointer;flex:none;position:relative}
.check::after{content:"";position:absolute;inset:-9px}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"]::before{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;line-height:18px;color:var(--ink-muted)}
.meta{align-items:center}
.meta .late{color:var(--overdue);font-weight:600}
.pr{border-radius:var(--r-sm);padding:0 8px;font-weight:600}
.pr.high{background:var(--prio-high-soft);color:var(--prio-high)} .pr.normal{background:var(--prio-normal-soft);color:var(--prio-normal)} .pr.low{background:var(--prio-low-soft);color:var(--prio-low)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}
.addrow{display:flex;gap:12px;align-items:end;flex-wrap:wrap} .addrow label{flex:1;min-width:180px}
.chip{flex:none;border-radius:var(--r-full);padding:2px 10px;font-size:12px;line-height:18px;font-weight:600;margin-top:4px;white-space:nowrap}
.chip.todo{border:1px solid var(--line-strong);color:var(--ink-muted)}
.chip.doing{background:var(--moon);color:var(--ink)}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.overdue{background:var(--overdue-soft);color:var(--overdue)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:24px;text-align:center;color:var(--ink-muted)}

.rows{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.rows>.prow:first-child,.rows>div:first-child>.prow{border-top:0}
button.prow{cursor:pointer}
.prow .nm{display:flex;align-items:center;gap:10px;min-width:0}
.prow .nm span{min-width:0;overflow-wrap:anywhere}
.prow.me{background:var(--moon-soft)}
.prow .cnt{white-space:nowrap;text-align:right}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;border:1.5px solid var(--line-strong)}
.rank.first{background:var(--moon);border-color:var(--ink)}
.sub{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--surface)}
.late{color:var(--overdue);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.urow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:16px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
@media (min-width:700px){.urow{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:20px;font-weight:600;min-width:0}
label.c{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:600}
label.c input{width:20px;height:20px;accent-color:var(--brand)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-raised);padding:8px 12px;font-weight:400;font-size:15px;width:100%;max-width:100%}
input[type=number]{width:88px}
textarea{min-height:80px;resize:vertical}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--surface-raised);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92%;overflow:auto;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.dlg{border-radius:var(--r-lg)}}
.dlg form,.dlg .stack{display:flex;flex-direction:column;gap:16px}
.dlg .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.dlg .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.dlg .ttl{display:flex;gap:12px;align-items:flex-start}
.dlg .ttl h2{flex:1;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.cmt{border-top:1px solid var(--line);padding-top:8px}
.cmtadd{display:flex;gap:8px}
.cmtadd input{flex:1;min-width:0}
.err{background:var(--overdue-soft);color:var(--overdue);border-radius:var(--r-md);padding:8px 12px;font-size:13px;font-weight:600}

.login{max-width:400px;margin:0 auto;padding-block:48px;display:flex;flex-direction:column;gap:24px}
.login img{height:40px;width:auto;align-self:flex-start}
.login form{display:flex;flex-direction:column;gap:16px}
.demo{display:flex;flex-direction:column;gap:8px}
.demo button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left}
.stack{display:flex;flex-direction:column;gap:16px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-raised);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--r-full);background:var(--overdue);color:#fff;font-size:12px;line-height:20px;font-weight:700;text-align:center}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none}.avbtn .av{width:44px;height:44px;font-size:15px}
.avbtn[aria-current="page"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--moon)}
.bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar2 h2{flex:1;min-width:0}
.nlist{display:flex;flex-direction:column}
.nitem{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.nitem:first-child{border-top:0}
.ndot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.nitem.unread .ndot{background:var(--brand)}
.ntext{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nlink{background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere;border-radius:var(--r-sm)}
.nlink b,.nmsg b{font-weight:600}
.okline{font-size:13px;line-height:20px;font-weight:600;color:var(--done)}
.conf{color:var(--done);font-weight:600}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.drow:first-child{border-top:0}
.drow .dacts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
@media (min-width:700px){.drow{grid-template-columns:auto minmax(0,1fr) auto}.drow .dacts{grid-column:auto}}
.ftype{width:44px;height:44px;border-radius:var(--r-sm);background:var(--prio-normal-soft);color:var(--prio-normal);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em}
.dname{min-width:0;overflow-wrap:anywhere}
.upl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl label.btn{display:inline-flex;align-items:center;position:relative}
.upl input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.upl label.btn:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.note-hint{font-size:13px;line-height:20px;color:var(--ink-muted)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.note{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nopen{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:var(--r-sm)}
.nopen h3{overflow-wrap:anywhere}
.ntxt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ci{display:flex;gap:8px;align-items:flex-start}
.tick{width:24px;height:24px;flex:none;border-radius:var(--r-sm);border:1.5px solid var(--line-strong);background:var(--surface-raised);cursor:pointer;position:relative;margin-top:0;padding:0}
.tick::after{content:"";position:absolute;inset:-8px}
.tick[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.tick[aria-pressed="true"]::before{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ci>span{overflow-wrap:anywhere;min-width:0}
.ci.ticked>span{text-decoration:line-through;color:var(--ink-muted)}
.nfoot{display:flex;gap:4px 8px;flex-wrap:wrap;font-size:12px;line-height:18px;color:var(--ink-muted);align-items:center}
.tag{background:var(--surface-raised);border-radius:var(--r-sm);padding:0 8px;color:var(--ink);font-weight:600}
.pinmark{font-size:12px;line-height:18px;font-weight:600}
.c-yellow{background:var(--note-yellow)}.c-blue{background:var(--note-blue)}.c-green{background:var(--note-green)}.c-pink{background:var(--note-pink)}.c-lilac{background:var(--note-lilac)}.c-white{background:var(--note-white)}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-strong);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--brand);outline-offset:2px}
.edrow{display:flex;gap:8px;align-items:center}
.edrow input[type=text]{flex:1;min-width:0;min-height:40px}
.ci.edrow.ticked input{text-decoration:line-through;color:var(--ink-muted)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 12px}
input[type=datetime-local]{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-raised);padding:8px 12px;font-weight:400;font-size:15px;width:100%;max-width:100%}
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.code{font-size:28px;line-height:40px;font-weight:700;letter-spacing:.2em}
.chat{background:var(--done-soft);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{background:var(--surface-raised);border-radius:var(--r-md);padding:10px 12px;max-width:440px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg .mt{font-size:12px;line-height:18px;color:var(--ink-muted);align-self:flex-end}
.msg ul{margin:0;padding-left:20px}
.kb{display:flex;gap:6px;flex-wrap:wrap}
.kb button{flex:1 1 120px;min-height:40px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.fab{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 20px 0 16px;border-radius:var(--r-full);border:0;background:var(--moon);color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.fab .fcount{min-width:22px;height:22px;border-radius:var(--r-full);background:var(--ink);color:var(--moon);font-size:12px;line-height:22px;text-align:center;padding:0 6px}
.fab[aria-expanded="true"]{outline:2px solid var(--ink);outline-offset:2px}
.fnpanel{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));max-height:min(65vh,560px);overflow:auto;background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.fnpanel .bar2 h2{font-size:17px;line-height:26px}
.fnpanel form{display:flex;gap:8px}.fnpanel form input{flex:1;min-width:0}
.fnlist{display:flex;flex-direction:column;gap:8px}
.note.mini{padding:12px;gap:6px;border-radius:var(--r-md)}
.note.mini .ntxt{-webkit-line-clamp:3}
.note.mini h3{font-size:15px;line-height:22px}
.more{font-size:12px;line-height:18px;color:var(--ink-muted)}
.shell.hasfab{padding-bottom:96px}
@media (max-width:899px){.fnpanel{max-height:min(50vh,520px)}.shell.hasfab.fnopen{padding-bottom:calc(50vh + 96px)}}
.hrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.hbar i{background:var(--done)}
.hbar.over i{background:var(--overdue)}
.hint-over{color:var(--overdue);font-weight:600}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.6fr) auto;gap:12px;align-items:center;padding:4px 0}
.crow span:first-child{overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;margin-inline:-4px}
table.rtbl{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;line-height:22px}
.rtbl th{text-align:left;font-size:12px;line-height:18px;color:var(--ink-muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line-strong)}
.rtbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rtbl .r{text-align:right;white-space:nowrap}
.rtbl tfoot td{font-weight:700;border-bottom:0}
.rtbl .over{color:var(--overdue);font-weight:600}
.rhead{flex:1;min-width:0}
.rlist{display:none;flex-direction:column}
.rlist>div{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.rlist>div:last-child{border-bottom:0}
@media (max-width:599px){.tblwrap{display:none}.rlist{display:flex}}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.rows>.rrow:first-child{border-top:0}
.fchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;background:var(--surface);font-size:13px;line-height:20px;overflow-wrap:anywhere}
.fchip b{white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--overdue)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--brand);color:var(--on-brand);padding:8px 16px;border-radius:var(--r-full);font-size:13px;font-weight:600;max-width:calc(100% - 32px)}

/* ===== Modern layer: softer elevation, larger radii, motion ===== */
:root{--line-soft:#e9e3d6;--on-brand-muted:#b9c2d6;--done-bright:#7cc7dd;--overdue-bright:#f4a26b;--brand-glow:#2a3d68;
  --sh-sm:0 1px 2px rgba(20,33,61,.06),0 2px 8px rgba(20,33,61,.04);--sh-md:0 6px 20px rgba(20,33,61,.08),0 2px 6px rgba(20,33,61,.05);--sh-lg:0 24px 60px rgba(20,33,61,.22);
  --ease:cubic-bezier(.2,.8,.2,1);--r-md:14px;--r-lg:22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--surface)}
h1{font-size:30px;line-height:40px;letter-spacing:-.02em}
.eyebrow{font-size:13px;line-height:20px;color:var(--ink-muted);font-weight:600}
.head .rhead{flex:1 1 300px}
@media (max-width:599px){.head>.btn{flex:1}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-block:10px;margin-block:-10px;background:rgba(247,244,236,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.task,.kpi,.rows,.card,.note,.fnpanel,nav.nav,.empty{border-color:var(--line-soft)}
.task,.kpi,.rows,.card,nav.nav{box-shadow:var(--sh-sm)}
.note{box-shadow:var(--sh-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.fnpanel{box-shadow:var(--sh-lg);border-color:var(--line-soft)}
.dlg{box-shadow:var(--sh-lg)}
.task{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
@media (hover:hover){.task:hover,.note:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(20,33,61,.28)}
  .btn:not(.primary):hover{background:var(--surface)}
  nav.nav button:not([aria-current]):hover{background:var(--surface);color:var(--ink)}
  .check:hover{border-color:var(--done);box-shadow:0 0 0 4px var(--done-soft)}
  .iconbtn:hover{box-shadow:var(--sh-md)}
  .fab:hover{transform:translateY(-2px)}}
.btn{transition:transform .12s var(--ease),box-shadow .2s var(--ease),background-color .2s}
.btn.primary{box-shadow:0 4px 14px rgba(20,33,61,.22)}
.btn:active,.tabs button:active,.iconbtn:active,.fab:active,.check:active,.tick:active,.kb button:active{transform:scale(.96)}
.tabs button,.check,.tick,.iconbtn,.fab{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .15s var(--ease)}
.iconbtn{border-color:var(--line-soft);box-shadow:var(--sh-sm)}
.fab{box-shadow:0 10px 26px rgba(20,33,61,.22)}
nav.nav button{display:flex;align-items:center;gap:12px;transition:background-color .2s,color .2s}
.ni{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ncount{margin-left:auto;min-width:22px;height:22px;border-radius:var(--r-full);background:var(--overdue);color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 6px}
nav.nav button[aria-current="page"] .ncount{background:var(--moon);color:var(--ink)}
@media (max-width:899px){nav.nav{top:calc(env(safe-area-inset-top,0px) + 66px);box-shadow:var(--sh-lg)}}
@media (min-width:900px){nav.nav{position:sticky;top:96px}}
.av[data-c="0"]{background:var(--note-yellow);color:var(--ink)}.av[data-c="1"]{background:var(--note-blue);color:var(--ink)}.av[data-c="2"]{background:var(--note-green);color:var(--ink)}
.av[data-c="3"]{background:var(--note-pink);color:var(--ink)}.av[data-c="4"]{background:var(--note-lilac);color:var(--ink)}.av[data-c="5"]{background:var(--brand);color:var(--on-brand)}
/* hero KPI card */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;color:var(--on-brand);background:radial-gradient(130% 120% at 100% 0%,var(--brand-glow) 0%,var(--brand) 60%);box-shadow:var(--sh-md);display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;right:-56px;top:-56px;width:170px;height:170px;border-radius:50%;background:var(--moon);opacity:.12;pointer-events:none}
.hero-top{display:flex;gap:20px;align-items:center;position:relative;z-index:1}
.ringwrap{position:relative;width:112px;height:112px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .prg{stroke:var(--moon);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num .big{font-size:34px;line-height:38px;font-weight:700}
.ring-num .cap{color:var(--on-brand-muted)}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hero .lab{color:var(--on-brand-muted)}
.hero-line{font-size:17px;line-height:26px;font-weight:600}
.togo{font-size:13px;line-height:20px;font-weight:600;color:var(--moon)}
.hero .dots{position:relative;z-index:1}
.hero .dots div{color:var(--on-brand-muted)}
.hero .dots b{border-color:rgba(255,255,255,.4)}
.hero .dots b.on{background:var(--on-brand);border-color:var(--on-brand)}
.hero .dots b.today{background:var(--moon);border-color:var(--moon);box-shadow:0 0 0 3px rgba(242,182,50,.28)}
.hero .hrow{border-top-color:rgba(255,255,255,.16);position:relative;z-index:1}
.hero .bar{background:rgba(255,255,255,.14)}
.hero .hbar i{background:var(--done-bright)}
.hero .hbar.over i{background:var(--overdue-bright)}
.hero .hint{color:var(--on-brand-muted)}
.hero .hint.over{color:var(--overdue-bright);font-weight:600}
@media (max-width:420px){.ringwrap{width:96px;height:96px}.ring-num .big{font-size:28px;line-height:32px}.hero-top{gap:16px}}
.spark{position:absolute;left:calc(50% - 4px);top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--moon);pointer-events:none;animation:spark .9s ease-out both}
/* login */
.login2{max-width:1000px;margin:0 auto;padding-block:24px;display:grid;grid-template-columns:1fr}
.lhero{position:relative;overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0;background:radial-gradient(130% 120% at 100% 0%,var(--brand-glow) 0%,var(--brand) 60%);color:var(--on-brand);padding:28px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.moonart{position:absolute;right:28px;top:26px;width:80px;height:80px;border-radius:50%;background:var(--moon);box-shadow:0 0 0 14px rgba(242,182,50,.12),0 0 0 30px rgba(242,182,50,.06)}
.lname{font-size:28px;line-height:36px;font-weight:700;position:relative}
.ltag{color:var(--on-brand-muted);max-width:30ch;position:relative}
.login2 .login{max-width:none;margin:0;background:var(--surface-raised);border-radius:0 0 var(--r-lg) var(--r-lg);padding:28px;box-shadow:var(--sh-md)}
@media (min-width:860px){.login2{grid-template-columns:1fr 1fr;padding-block:64px}.lhero{border-radius:var(--r-lg) 0 0 var(--r-lg);min-height:600px;padding:44px}
  .moonart{width:150px;height:150px;right:56px;top:56px}.lname{font-size:44px;line-height:52px}.login2 .login{border-radius:0 var(--r-lg) var(--r-lg) 0;padding:48px}}
/* dialogs: grab handle on phones */
.dlg::before{content:"";align-self:center;flex:none;width:40px;height:4px;border-radius:var(--r-full);background:var(--line);margin:-6px 0 2px}
@media (min-width:700px){.dlg::before{display:none}}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes menu{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes checkpop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes leave{to{opacity:0;transform:translateX(28px) scale(.98)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes glow{0%,100%{box-shadow:var(--sh-md)}50%{box-shadow:0 0 0 6px rgba(242,182,50,.4),var(--sh-md)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
main.enter>*{animation:rise .45s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.24s}
main.enter .list>*,main.enter .board>*,main.enter .rows>*{animation:rise .4s var(--ease) both}
main.enter .list>*:nth-child(2),main.enter .board>*:nth-child(2),main.enter .rows>*:nth-child(2){animation-delay:.2s}
main.enter .list>*:nth-child(3),main.enter .board>*:nth-child(3),main.enter .rows>*:nth-child(3){animation-delay:.24s}
main.enter .list>*:nth-child(4),main.enter .board>*:nth-child(4),main.enter .rows>*:nth-child(4){animation-delay:.28s}
main.enter .list>*:nth-child(n+5),main.enter .board>*:nth-child(n+5),main.enter .rows>*:nth-child(n+5){animation-delay:.32s}
main.enter .bar i{transform-origin:left;animation:grow .9s var(--ease) both .2s}
main.enter .ring .prg{animation:ring 1.1s var(--ease) both .15s}
.scrim.enter{animation:fade .2s ease both}
.scrim.enter .dlg{animation:sheet .34s var(--ease) both}
@media (min-width:700px){.scrim.enter .dlg{animation:pop .26s var(--ease) both}}
nav.nav.openmenu.enter{animation:menu .22s var(--ease) both;transform-origin:top left}
.navscrim.enter{animation:fade .2s ease both}
.fnpanel.enter{animation:pop .26s var(--ease) both;transform-origin:bottom right}
.toast:not([hidden]){animation:toastin .32s var(--ease) both}
.bump{display:inline-block;animation:bump .55s var(--ease)}
.task.completing{animation:leave .35s var(--ease) .3s both;pointer-events:none}
.task.completing .check{background:var(--done);border-color:var(--done);animation:checkpop .3s var(--ease)}
.task.completing .check::before{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task.completing h3{text-decoration:line-through;color:var(--ink-muted)}
.hero.celebrate{animation:glow 1.1s ease 2}
.login2.enter>*{animation:rise .5s var(--ease) both}.login2.enter>*:nth-child(2){animation-delay:.08s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(extClick(a,b,id))return;
  if(a==="scrim"){if(e.target!==b)return;S.dlg=null}
  else if(a==="nav"){S.view=b.dataset.v;S.expand=null}
  else if(a==="lang"){S.lang=S.lang==="en"?"km":"en";try{localStorage.setItem("pc-lang",S.lang)}catch(x){}}
  else if(a==="signout"){S.me=null;S.dlg=null;S.err=""}
  else if(a==="demo"){login(b.dataset.u);return}
  else if(a==="filter")S.filter=b.dataset.f;
  else if(a==="clearf")S.fDue=S.fPrio=S.fClient="any";
  else if(a==="expand")S.expand=S.expand===id?null:id;
  else if(a==="new"){S.err="";S.dlg={type:"new",assign:!!b.dataset.assign}}
  else if(a==="newuser"){S.err="";S.dlg={type:"user"}}
  else if(a==="open")S.dlg={type:"task",id};
  else if(a==="close")S.dlg=null;
  else if(a==="toggle"){const k=tasks.find(x=>x.id===id);if(k.status==="done"){k.status="todo";k.doneAt=null}else{k.status="done";k.doneAt=TODAY}}
  else if(a==="reopen"){const k=tasks.find(x=>x.id===id);k.status="todo";k.doneAt=null;render();toast(t("reopened"));return}
  else if(a==="status"){const k=tasks.find(x=>x.id===S.dlg.id);k.status=b.dataset.v;k.doneAt=k.status==="done"?TODAY:null}
  else if(a==="resetpw"){toast(t("pwReset")+" "+U(id).name);return}
  render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==="login"){login(val("li-user"));return}
  if(f==="task"){const title=val("nt-title"),er=m=>{const e=document.getElementById("nt-err");e.textContent=m;e.hidden=false};if(!title){er(t("titleReq"));return}
    const est=parseFloat(val("nt-est"));if(!(est>0)){er(t("estReq"));document.getElementById("nt-est").focus();return}
    let client=val("nt-client");if(client==="__new"){const n=val("nt-newclient");if(!n){er(t("clientReq"));return}client=addClient(n).id}
    tasks.push({id:"t"+(++tid),est,client,title,desc:val("nt-desc"),to:val("nt-to")||S.me,by:S.me,due:val("nt-due")||off(2),prio:val("nt-prio"),status:"todo",doneAt:null,repeat:document.getElementById("nt-rep").checked,comments:[]});

  if(f==="client"){const n=val("cl-name");if(!n)return;if(clients.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast(t("clientDup"));return}addClient(n);render();toast(t("clientSaved"));return}
  if(f==="comment"){const text=val("cm-text");if(text){const k=tasks.find(x=>x.id===S.dlg.id);k.comments.push({by:S.me,text,at:TODAY});[k.to,k.by].filter((v,i,a)=>v!==S.me&&a.indexOf(v)===i).forEach(u=>notify(u,"comment",{by:S.me,task:k.id}));render()}return}
  if(f==="user"){const name=val("nu-name"),un=val("nu-user").toLowerCase();
    if(!name||!un||!document.getElementById("nu-pw").value){S.err=t("userReq");render();return}
    if(users.some(u=>u.username===un)){S.err=t("userDup");render();return}
    users.push({id:"u"+(users.length+1)+"n",name,username:un,role:val("nu-role"),kpi:Math.max(0,+val("nu-kpi")||0),cap:Math.max(1,Math.min(80,+val("nu-cap")||44)),active:true});

});

  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);

    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPt=canvas.width/pw,pageH=Math.floor(ph*pxPerPt);

      const sh=Math.min(pageH,canvas.height-y),c=document.createElement("canvas");c.width=canvas.width;c.height=sh;
      const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,sh);ctx.drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,sh/pxPerPt);
    }
    const blob=pdf.output("blob");

}

  if(m.role!=="staff"){const late=tasks.filter(k=>k.status!=="done"&&k.due<TODAY&&k.to!==S.me&&U(k.to).role!=="admin"&&U(k.to).active);
    out.push(msg(fmt(TODAY)+", 08:05",late.length?`<p>${t("bTeam")}</p><ul>${late.map(k=>`<li>${esc(U(k.to).name)}: ${esc(k.title)}</li>`).join("")}</ul>`:`<p>${t("bTeamOk")}</p>`,""))}
  if(!tgPick[S.me]){const nk=mine.filter(k=>k.by!==S.me&&k.status!=="done").slice(-1)[0],rk=open.find(k=>k.due===off(1)&&k!==nk);tgPick[S.me]={nk:nk?.id,rk:rk?.id}}
  const nk=tasks.find(k=>k.id===tgPick[S.me].nk),rk=tasks.find(k=>k.id===tgPick[S.me].rk);
  if(nk)out.push(msg(fmt(TODAY)+", 09:15",`<p>${fill(t("bNew"),esc(U(nk.by).name),"<b>"+esc(nk.title)+"</b>")}</p><p class="cap muted">${dueText(nk)}</p>${state(nk)}`,acts(nk)));
  if(rk)out.push(msg(fmt(TODAY)+", 16:00",`<p>${fill(t("bRemind"),"","<b>"+esc(rk.title)+"</b>")}</p>${state(rk)}`,acts(rk)));
  {const mr=reports.filter(x=>x.uid===S.me).slice(-1)[0];if(mr){
    out.push(msg(fmtAt(mr.at),`<p>${fill(t("bRepSent"),wkLabel(mr.wk),approversOf(S.me).map(x=>esc(U(x).name)).join(", "))}</p><div class="fchip"><b>PDF</b><span>${esc(pdfName(mr.uid,mr.wk))}</span></div>`,""));
    if(mr.status==="approved")out.push(msg(fmtAt(mr.at2),`<p>${fill(t("bRepOk"),esc(U(mr.by).name),wkLabel(mr.wk))}</p>`,""));
    if(mr.status==="returned")out.push(msg(fmtAt(mr.at2),`<p>${fill(t("bRepBack"),esc(U(mr.by).name),"<b>"+esc(mr.comment)+"</b>")}</p>`,`<button data-act="rep-open" data-id="${mr.id}">${t("bOpen")}</button>`))}}
  reports.filter(r=>r.status==="pending"&&canDecide(r)).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,2).reverse().forEach(r=>out.push(msg(fmtAt(r.at),`<p>${fill(t("bRep"),"<b>"+esc(U(r.uid).name)+"</b>",fill(t("nTasksH"),r.snap.items.length,fh(r.snap.items.reduce((a,x)=>a+x.spent,0))))}</p><div class="fchip"><b>PDF</b><span>${esc(pdfName(r.uid,r.wk))}</span></div>${r.note?`<p class="cap muted">${t("noteMgr")}: ${esc(r.note)}</p>`:""}`,`<button data-act="rep-ok" data-id="${r.id}">${t("approve")}</button><button data-act="rep-open" data-id="${r.id}">${t("review")}</button>`)));
  const nr=notes.filter(n=>n.owner===S.me&&n.remind).sort((a,b)=>a.remind.localeCompare(b.remind))[0];
  if(nr)out.push(msg(fmtAt(nr.remind),`<p>${fill(t("bNote"),"","<b>"+esc(nr.title||t("notes"))+"</b>")}</p>`,""));
  return `<div class="chat">${out.join("")}</div>`;
}
function vAccount(){
  const m=me(),st=tg[S.me];
  return `<div class="head"><h1>${t("account")}</h1></div>
   <section class="card"><div class="who"><span class="av" style="width:48px;height:48px">${avIn(m)}</span><span><b>${esc(m.name)}</b><br><span class="cap muted">@${esc(m.username)} · ${t(m.role)}</span></span></div>
    <div class="stack" style="gap:8px"><span class="lab">${t("language")}</span><div class="tabs"><button data-act="setlang" data-v="en" aria-pressed="${S.lang==="en"}">English</button><button data-act="setlang" data-v="km" aria-pressed="${S.lang==="km"}">ភាសាខ្មែរ</button></div></div>
    <button class="btn" data-act="signout" style="align-self:flex-start">${t("signout")}</button></section>
   <section class="card"><h2>${t("tgTitle")}</h2><p class="muted">${t("tgHelp")}</p>
    ${st==="linked"?`<p class="okline">${t("tgLinked")}</p><button class="btn" data-act="tg-off" style="align-self:flex-start">${t("tgDisconnect")}</button>`
     :st==="code"?`<p>${t("tgStep")}</p><p class="code num">${tgCode[S.me]}</p><button class="btn primary" data-act="tg-confirm" style="align-self:flex-start">${t("tgDoneStep")}</button>`
     :`<button class="btn primary" data-act="tg-connect" style="align-self:flex-start">${t("tgConnect")}</button>`}</section>
   ${st==="linked"?`<section class="stack"><div><h2>${t("tgPreview")}</h2><p class="muted">${t("tgSample")}</p></div>${chat()}</section>`:""}`;
}

function extClick(a,b,id){
  switch(a){
   case "menu":S.menu=!S.menu;break;
   case "toggle":{const k=tasks.find(x=>x.id===id);if(k.status==="done"){k.status="todo";k.doneAt=null;k.spent=null}else S.dlg={type:"log",id};break}
   case "status":{const k=tasks.find(x=>x.id===S.dlg.id),v=b.dataset.v;if(v==="done"&&k.status!=="done"){S.dlg={type:"log",id:k.id,back:true};break}if(v!=="done")k.spent=null;return false}
   case "reopen":{const k=tasks.find(x=>x.id===id);if(k)k.spent=null;return false}
   case "lg-pick":{const el=document.getElementById("lg-h");el.value=b.dataset.h;el.focus();return true}
   case "lg-cancel":S.dlg=S.dlg.back?{type:"task",id:S.dlg.id,focused:true}:null;break;
   case "fn-toggle":S.fn=!S.fn;render();if(S.fn)document.getElementById("qn-text")?.focus();else document.querySelector(".fab")?.focus();return true;
   case "navclose":S.menu=false;break;
   case "nav":S.menu=false;S.repId=null;return false;
   case "go-report":S.view="report";S.repId=null;S.repWk=elapsed<2?LWK:WK0;S.repNote="";break;
   case "go-tasks":S.view="tasks";S.repId=null;break;
   case "go-reports":S.view="reports";S.repId=null;break;
   case "rep-open":S.view="report";S.repId=id;break;
   case "repwk":S.repWk=b.dataset.v;break;
   case "rtab":S.rTab=b.dataset.v;break;
   case "rep-pdf":makePdf(b.dataset.uid,b.dataset.wk,b.dataset.rep,b);return true;
   case "rep-submit":{const wk=b.dataset.wk,note=(document.getElementById("rp-note")?.value||"").trim();
     const r={id:"r"+(++rid),uid:S.me,wk,snap:buildReport(S.me,wk),note,status:"pending",at:stamp()};reports.push(r);
     approversOf(S.me).forEach(u=>notify(u,"rep",{by:S.me,rep:r.id}));S.repNote="";render();scrollTo(0,0);toast(t("submittedT"));return true}
   case "rep-ok":{const r=reports.find(x=>x.id===id);r.status="approved";r.by=S.me;r.at2=stamp();notify(r.uid,"repok",{by:S.me,rep:r.id});render();toast(t("approvedToast"));return true}
   case "rep-back":{const r=reports.find(x=>x.id===id),c=(document.getElementById("rp-back")?.value||"").trim();
     if(!c){const er=document.getElementById("rp-err");er.textContent=t("backReq");er.hidden=false;document.getElementById("rp-back").focus();return true}
     r.status="returned";r.by=S.me;r.at2=stamp();r.comment=c;notify(r.uid,"repback",{by:S.me,rep:r.id});render();toast(t("returnedToast"));return true}
   case "bell":S.menu=false;S.dlg={type:"notifs"};break;
   case "account":S.menu=false;S.view="account";S.dlg=null;break;
   case "setlang":S.lang=b.dataset.v;try{localStorage.setItem("pc-lang",S.lang)}catch(x){}break;
   case "markall":notifs.forEach(n=>{if(n.to===S.me)n.read=true});break;
   case "nopen":{const n=notifs.find(x=>x.id===id);n.read=true;
     if(n.p.task&&tasks.some(k=>k.id===n.p.task))S.dlg={type:"task",id:n.p.task};
     else if(n.p.rep){S.dlg=null;S.view="report";S.repId=n.p.rep}
     else if(n.kind==="file"){S.dlg=null;S.view="docs";S.dTab="company"}
     else if(n.kind==="note"){S.view="notes";S.nTab="shared";S.dlg=null;openNote(n.p.note)}
     else S.dlg=null;break}
   case "kpi-confirm":kpiConf[S.me]=stamp();notifs.forEach(n=>{if(n.to===S.me&&n.kind==="kpi")n.read=true});render();toast(t("confirmThanks"));return true;
   case "dtab":S.dTab=b.dataset.v;S.arm=null;break;
   case "dclient":S.dClient=b.dataset.v;S.arm=null;break;
   case "dl":toast(t("dlNote"));return true;
   case "ddel":if(S.arm!==id){S.arm=id;break}docs.splice(docs.findIndex(d=>d.id===id),1);S.arm=null;render();toast(t("deleted"));return true;
   case "gofiles":S.dlg=null;S.view="docs";S.dTab="clients";S.dClient=b.dataset.c;break;
   case "ntab":S.nTab=b.dataset.v;break;
   case "ntick":{const x=notes.find(n=>n.id===id).items[+b.dataset.i];x.done=!x.done;break}
   case "nnew":S.arm=null;S.dlg={type:"note",isNew:true,draft:{id:null,owner:S.me,title:"",text:"",items:[],color:"yellow",pinned:false,label:"",share:"private",people:[],remind:""}};break;
   case "nedit":S.arm=null;openNote(id);break;
   case "nd-tick":{const x=S.dlg.draft.items[+b.dataset.i];x.done=!x.done;break}
   case "nd-del":S.dlg.draft.items.splice(+b.dataset.i,1);break;
   case "nd-add":addItem();return true;
   case "nd-color":S.dlg.draft.color=b.dataset.c;break;
   case "nd-clearrem":{S.dlg.draft.remind="";const el=document.getElementById("nd-remind");el.value="";b.hidden=true;document.getElementById("nd-pin")?.focus();return true}
   case "nd-task":{const i=+b.dataset.i,x=S.dlg.draft.items[i];if(!x.t.trim())return true;
     tasks.push({id:"t"+(++tid),est:1,client:"",title:x.t.trim(),desc:"",to:S.me,by:S.me,due:off(2),prio:"normal",status:"todo",doneAt:null,repeat:false,comments:[]});
     x.task=true;const saved=notes.find(n=>n.id===S.dlg.draft.id);if(saved&&saved.items[i])saved.items[i].task=true;
     render();toast(t("taskMade"));return true}
   case "nd-delnote":if(S.arm!=="note"){S.arm="note";break}notes.splice(notes.findIndex(n=>n.id===S.dlg.draft.id),1);S.arm=null;S.dlg=null;render();toast(t("noteDeleted"));return true;
   case "nd-save":saveNote();return true;
   case "tg-connect":tgCode[S.me]=String(100000+Math.floor(Math.random()*900000));tg[S.me]="code";break;
   case "tg-confirm":tg[S.me]="linked";break;
   case "tg-off":delete tg[S.me];break;
   case "tg-start":tasks.find(x=>x.id===id).status="doing";break;
   case "tg-done":S.dlg={type:"log",id};break;
   case "tg-open":toast(t("openApp"));return true;
   default:return false;
  }
  render();return true;
}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.nd&&S.dlg?.draft){S.dlg.draft[el.dataset.nd]=el.value;if(el.id==="nd-remind")document.getElementById("nd-clearrem").hidden=!el.value;return}
  if(el.dataset.ndi!=null&&S.dlg?.draft){S.dlg.draft.items[+el.dataset.ndi].t=el.value;return}
  if(el.id==="rp-note"){S.repNote=el.value;return}
  if(el.dataset.x==="dq"||el.dataset.x==="nq"){S[el.dataset.x]=el.value;render();const n=document.getElementById(el.id);n.focus();n.setSelectionRange(n.value.length,n.value.length)}
});
document.addEventListener("change",e=>{
  const x=e.target.dataset.x;if(!x)return;
  if(x==="upload"){upload(e.target);return}
  if(x==="dtype")S.dType=e.target.value;
  else if(x==="nlabel")S.nLabel=e.target.value;
  else if(x==="nd-pin")S.dlg.draft.pinned=e.target.checked;
  else if(x==="nd-share")S.dlg.draft.share=e.target.value;
  else if(x==="nd-person"){const p=S.dlg.draft.people,v=e.target.value;if(e.target.checked)p.push(v);else p.splice(p.indexOf(v),1);return}
  else return;
  render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.menu&&!S.dlg){S.menu=false;render();document.querySelector(".menubtn")?.focus()}});
/* Reminder: tapping an empty field fills in today at the next full hour */
function fillRemind(e){const el=e.target;if(el.id!=="nd-remind"||el.value||!S.dlg?.draft)return;
  const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);
  const v=TODAY+"T"+(iso(d)===TODAY?pad(d.getHours())+":00":"23:59");
  el.value=v;S.dlg.draft.remind=v;document.getElementById("nd-clearrem").hidden=false}
document.addEventListener("focusin",fillRemind);
document.addEventListener("pointerdown",fillRemind);
document.addEventListener("submit",e=>{if(e.target.dataset.form!=="qnote")return;e.preventDefault();
  const v=document.getElementById("qn-text").value.trim();if(!v)return;
  notes.push({id:"nt"+(++noteId),owner:S.me,title:v,text:"",items:[],color:"yellow",pinned:false,label:"",share:"private",people:[],remind:""});
  render();document.getElementById("qn-text")?.focus();toast(t("noteAdded"))});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nd-new"){e.preventDefault();addItem()}});

render();
</script>
