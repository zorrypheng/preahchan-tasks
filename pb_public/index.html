/* ---------- actions ---------- */
function canMoveAny(k){return !!k&&(isTaskMgr(me())||supervises(S.me,k.to))}
async function moveTo(k,stageId){
  const s=ST(stageId);if(!k||!s||stageId===k.stage)return;
  const nx=nextStageOf(k);
  if(nx&&nx.id===stageId&&canFinish(k)){S.dlg={type:"finish",id:k.id,back:!!(S.dlg&&S.dlg.type==="task")};render();return}
  if(!canMoveAny(k)){toast(t("useFinish"));render();return}
  try{await pb.collection("tasks").update(k.id,{stage:stageId});await loadAll();
    if(!seesStage(stageId,k.to)){S.dlg={type:"handoff",id:k.id,stage:stageId}}
    render();toast(fill(t("movedTo"),nm(s)))}catch(e){fail(e);refresh(true)}
}
function draftFor(kind,id){
  if(kind==="stEdit"){const s=ST(id)||{name:"",name_km:"",color:"gray",done:false};return {id:s.id||null,name:s.name,name_km:s.name_km||"",color:s.color||"gray",done:!!s.done,hours:s.hours||"",pos:s.pos||"",workers:[...(s.workers||(s.pos?[s.pos]:[]))]}}
  if(kind==="ttEdit"){const x=TT(id)||{name:"",name_km:"",statuses:[],est:0};return {id:x.id||null,name:x.name,name_km:x.name_km||"",statuses:[...(x.statuses||[])],est:x.est||""}}
  const p=PO(id)||{name:"",name_km:"",types:[],statuses:[]};return {id:p.id||null,name:p.name,name_km:p.name_km||"",types:[...p.types],statuses:[...p.statuses]};
}
async function saveDraft(){
  const d=S.dlg.draft,kind=S.dlg.type,er=document.getElementById("sd-err");
  if(!d.name.trim()){er.textContent=t("nameReq");er.hidden=false;return}
  const col=kind==="stEdit"?"statuses":kind==="ttEdit"?"task_types":"positions";
  const data={name:d.name.trim(),name_km:(d.name_km||"").trim()};
  if(kind==="stEdit"){data.color=d.color;data.done=!!d.done;data.hours=d.hours||"";data.workers=positions.filter(p=>d.workers.includes(p.id)).map(p=>p.id);if(!d.id)data.sort=(sortedSt().slice(-1)[0]?.sort||0)+10}
  if(kind==="ttEdit"){data.statuses=sortedSt().filter(s=>d.statuses.includes(s.id)).map(s=>s.id);data.est=parseFloat(d.est)||0}
  if(kind==="poEdit"){data.types=d.types;data.statuses=d.statuses}
  try{d.id?await pb.collection(col).update(d.id,data):await pb.collection(col).create(data);S.dlg=null;S.arm=null;await refresh(true);toast(t("savedT"))}
  catch(e){er.textContent=(e&&e.response&&e.response.data&&e.response.data.name)?e.response.data.name.message:((e&&e.message)||"Error");er.hidden=false}
}
async function delDraft(){
  const d=S.dlg.draft,kind=S.dlg.type,col=kind==="stEdit"?"statuses":kind==="ttEdit"?"task_types":"positions";
  const used=kind==="stEdit"?tasks.some(k=>k.stage===d.id):kind==="ttEdit"?tasks.some(k=>k.type===d.id):false;
  const er=document.getElementById("sd-err");if(used){er.textContent=t("inUse");er.hidden=false;S.arm=null;return}
  try{await pb.collection(col).delete(d.id);S.dlg=null;S.arm=null;await refresh(true);toast(t("deleted"))}catch(e){er.textContent=(e&&e.message)||"Error";er.hidden=false}
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||!S.me)return;
  const a=b.dataset.act,id=b.dataset.id,stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
  switch(a){
    case "mode":stop();S.mode=b.dataset.v;try{localStorage.setItem("pc-mode",S.mode)}catch(x){}render();return;
    case "scope":stop();S.scope=b.dataset.v;render();return;
    case "clearf":S.fType="any";return;
    case "next":{stop();const k=tasks.find(x=>x.id===id);const nx=k&&nextStageOf(k);if(!nx){toast(t("lastStep"));return}if(!canFinish(k)){toast(t("useFinish"));return}S.dlg={type:"finish",id:k.id};render();return}
    case "handoff":{stop();const k=tasks.find(x=>x.id===S.dlg.id),u=U(b.dataset.u);S.dlg=null;
      run(()=>pb.collection("tasks").update(k.id,{assignee:u.id}),fill(t("handedTo"),u.name));return}
    case "upos-open":stop();S.dlg={type:"upos",id};render();return;
    case "uteam-open":stop();S.dlg={type:"uteam",id};render();return;
    case "uteam-save":{stop();const sid=S.dlg.id,on=new Set([...document.querySelectorAll('input[name="ut-staff"]:checked')].map(x=>x.value));S.dlg=null;
      const changes=users.filter(u=>u.id!==sid&&on.has(u.id)!==(u.supervisors||[]).includes(sid))
        .map(u=>pb.collection("users").update(u.id,{supervisors:on.has(u.id)?[...(u.supervisors||[]),sid]:(u.supervisors||[]).filter(x=>x!==sid)}));
      run(()=>Promise.all(changes),t("teamSaved"));return}
    case "upos-save":{stop();const uid=S.dlg.id,ids=[...document.querySelectorAll('input[name="up-pos"]:checked')].map(x=>x.value);S.dlg=null;
      run(()=>pb.collection("users").update(uid,{positions:ids}),t("posSaved"));return}
    case "set-tab":stop();S.setTab=b.dataset.v;render();return;
    case "st-edit":case "tt-edit":case "po-edit":{stop();const kind=a==="st-edit"?"stEdit":a==="tt-edit"?"ttEdit":"poEdit";S.arm=null;S.dlg={type:kind,draft:draftFor(kind,id)};render();return}
    case "sd-color":stop();S.dlg.draft.color=b.dataset.c;render();return;
    case "sd-save":stop();saveDraft();return;
    case "sd-del":stop();if(S.arm!=="sd"){S.arm="sd";render();return}delDraft();return;
    case "st-move":{stop();const list=sortedSt(),i=list.findIndex(s=>s.id===id),j=i+(+b.dataset.d);if(j<0||j>=list.length)return;
      const A=list[i],B=list[j];run(async()=>{await pb.collection("statuses").update(A.id,{sort:B.sort});await pb.collection("statuses").update(B.id,{sort:A.sort===B.sort?A.sort+1:A.sort})});return}
  }
},true);
document.addEventListener("change",e=>{
  const el=e.target;if(!S.me)return;
  if(el.dataset.x==="move"&&el.value){e.stopImmediatePropagation();moveTo(tasks.find(x=>x.id===el.dataset.id),el.value);return}
  if(el.dataset.x==="stage"&&el.value){e.stopImmediatePropagation();const k=tasks.find(x=>x.id===S.dlg.id);moveTo(k,el.value);return}
  if(el.dataset.x==="ttype"){e.stopImmediatePropagation();const k=tasks.find(x=>x.id===S.dlg.id),f=flowOf(el.value);
    const data={type:el.value};if(el.value&&!f.some(s=>s.id===k.stage))data.stage=(f[0]||{}).id||"";run(()=>pb.collection("tasks").update(k.id,data));return}
  if(el.dataset.x==="ntype"){
    const area=document.getElementById("nt-body"),tpl=tplFor(el.value),cur=area?cleanHTML(area.innerHTML):"";
    if(area&&(!plainText(cur).trim()&&!/<table/i.test(cur)||cur===S.dlg.autoTpl)){const html=tpl?cleanHTML(tpl.body):"";area.innerHTML=html;S.dlg.body=html;S.dlg.autoTpl=cleanHTML(area.innerHTML)}return}
  if(el.dataset.sl&&S.dlg&&S.dlg.draft){const arr=S.dlg.draft[el.dataset.sl];if(el.checked){if(!arr.includes(el.value))arr.push(el.value)}else arr.splice(arr.indexOf(el.value),1);return}
  if(el.dataset.sdB&&S.dlg&&S.dlg.draft){S.dlg.draft[el.dataset.sdB]=el.checked;return}
},true);
document.addEventListener("input",e=>{const el=e.target;

function cleanHTML(html){

    const tag=c.tagName;
    if(RT_DROP[tag]){c.remove();return}
    walk(c);
    if(!RT_KEEP[tag]){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{if(!(tag==="A"&&a.name==="href"))c.removeAttribute(a.name)});
    if(tag==="A"){const h=c.getAttribute("href")||"";if(!/^(https?:|mailto:)/i.test(h))c.removeAttribute("href");else{c.setAttribute("target","_blank");c.setAttribute("rel","noopener noreferrer")}}
  })};

}

async function compressImage(file){
  if(file.type==="image/gif"||file.type==="image/svg+xml")return file;
  let bmp=null;try{bmp=await createImageBitmap(file)}catch(e){return file}
  const sc=Math.min(1,1920/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  if(!blob||blob.size>=file.size)return file;
  return new File([blob],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});
}

  const ff=new FFmpeg();
  await ff.load({coreURL:await toBlobURL(core+"ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(core+"ffmpeg-core.wasm","application/wasm"),
    classWorkerURL:await toBlobURL(FF_NPM+"@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js","text/javascript")});
  FF=ff;return ff;
}
async function compressVideo(file,onP){

  onP(-1);const ff=await getFFmpeg();
  const ext=(file.name.match(/\.[a-z0-9]+$/i)||[".mp4"])[0].toLowerCase(),inN="in"+ext;
  await ff.writeFile(inN,new Uint8Array(await file.arrayBuffer()));

  try{
    await ff.exec(["-i",inN,"-vf","scale='if(gt(iw,ih),min(1280,iw),-2)':'if(gt(iw,ih),-2,min(1280,ih))'","-c:v","libx264","-preset","veryfast","-crf","28",
      "-c:a","aac","-b:a","96k","-movflags","+faststart","out.mp4"]);

}
async function prepareFile(file,status){

    if(kind==="image"){status(fill(t("compressing"),file.name));out=await compressImage(file)}
    if(kind==="video"&&file.size>=VIDEO_MIN){out=await compressVideo(file,p=>status(p<0?t("loadingFF"):fill(t("compressingV"),file.name,Math.round(p*100))))}
  }catch(e){
    if(e&&e.tooBigIn)throw new Error(fill(t("tooBigIn"),file.name));
    console.error(e);status(fill(t("compressFail"),file.name));out=file;

/* ---------- table tools ---------- */
function cellCtx(){
  const sel=getSelection();if(!sel||!sel.rangeCount)return null;
  let n=sel.anchorNode;if(n&&n.nodeType===3)n=n.parentNode;
  const cell=n&&n.closest&&n.closest("td,th"),area=cell&&cell.closest("[data-rta]");
  return cell&&area?{cell,row:cell.parentElement,table:cell.closest("table"),area}:null;
}
function placeIn(cell){if(!cell)return;const r=document.createRange();r.selectNodeContents(cell);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function tableOp(cmd){
  const c=cellCtx();if(!c)return;const {cell,row,table}=c,idx=cell.cellIndex;
  if(cmd==="addRow"){const body=table.tBodies[0]||table.createTBody(),nr=document.createElement("tr");
    for(let i=0;i<row.cells.length;i++){const td=document.createElement("td");td.innerHTML="<br>";nr.appendChild(td)}
    if(row.parentElement.tagName==="THEAD")body.insertBefore(nr,body.firstChild);else row.after(nr);placeIn(nr.cells[Math.min(idx,nr.cells.length-1)])}
  if(cmd==="addCol"){[...table.rows].forEach(tr=>{const head=tr.parentElement.tagName==="THEAD",nc=document.createElement(head?"th":"td");nc.innerHTML="<br>";tr.insertBefore(nc,tr.cells[idx+1]||null)});placeIn(row.cells[idx+1])}
  if(cmd==="delRow"){if(table.rows.length<=1){table.remove();return}const next=row.nextElementSibling||row.previousElementSibling;row.remove();if(next)placeIn(next.cells[0])}
  if(cmd==="delCol"){if(row.cells.length<=1){table.remove();return}[...table.rows].forEach(tr=>{if(tr.cells[idx])tr.cells[idx].remove()});placeIn(row.cells[Math.max(0,idx-1)])}
  if(cmd==="delTable")table.remove();
}
function tblTools(){const c=cellCtx();document.querySelectorAll(".rt").forEach(r=>{const tools=r.querySelector(".rt-tbl");if(tools)tools.hidden=!(c&&r.contains(c.area))})}

const usd=n=>"$"+(Math.round((n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const paidHoursMonth=u=>(u.cap||44)*52/12;
function salaryAt(uid,day){let m=null;salaries.forEach(s=>{if(s.user===uid&&s.from<=day&&(!m||s.from>=m.from))m=s});return m}
function rateAt(uid,day){const u=U(uid),s=salaryAt(uid,day);return u&&s&&s.monthly>0?s.monthly/paidHoursMonth(u):0}

/* the period shown on the Costs page, as [from,to] dates */
function costRange(){
  const d=new Date(TODAY+"T00:00:00"),first=new Date(d.getFullYear(),d.getMonth(),1);
  if(S.cPer==="week")return [WK0,WK6];
  if(S.cPer==="last"){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return [iso(a),iso(b)]}
  if(S.cPer==="custom"&&S.cFrom&&S.cTo)return S.cFrom<=S.cTo?[S.cFrom,S.cTo]:[S.cTo,S.cFrom];
  return [iso(first),iso(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
/* salary owed for the days in the range that have passed, and the paid hours in them (days with a salary only) */
function paidIn(u,a,b){
  const end=b<TODAY?b:TODAY;let money=0,days=0;
  for(let d=new Date(a+"T00:00:00");iso(d)<=end;d=addDays(d,1)){const s=salaryAt(u.id,iso(d));if(s&&s.monthly>0){days++;money+=s.monthly*12/365}}
  return {money,hours:(u.cap||44)*days/7};
}

   <p class="cap muted">${esc(fmtDay(a))} – ${esc(fmtDay(b))}</p>
   <div class="tiles">${tile(t("costLogged"),usd(tot),`${rows.length} ${t("colTasks").toLowerCase()}`)}${tile(t("hoursLogged"),Math.round(hrs*10)/10,t("hrs"))}${tile(t("paidPeriod"),usd(paid),"")}${tile(t("utilT"),pct(hrsPaid,paidH),`${Math.round(hrsPaid)} / ${Math.round(paidH)} ${t("hrs")}`)}</div>
   <section class="csec"><h2>${t("byClient")}</h2>${clientRows.length?table([t("client"),t("colTasks"),t("colHours"),t("colCost"),""],clientRows.map(g=>`<tr><th scope="row">${g.k?esc(C(g.k)||"–"):`<span class="muted">${t("noClient")}</span>`}</th><td class="num">${g.n}</td><td class="num">${Math.round(g.h*100)/100}</td><td class="num"><b>${usd(g.cost)}</b></td><td>${bar(g.cost)}</td></tr>`).join("")):`<p class="empty">${t("noCosts")}</p>`}</section>
   <section class="csec"><h2>${t("byType")}</h2>${typeRows.length?table([t("type"),t("colTasks"),t("colAvgH"),t("colAvgC"),t("colCost")],typeRows.map(g=>{const x=TT(g.k);return `<tr><th scope="row">${x?esc(nm(x)):`<span class="muted">${t("noType2")}</span>`}</th><td class="num">${g.n}</td><td class="num">${Math.round(g.h/g.n*100)/100}</td><td class="num">${usd(g.cost/g.n)}</td><td class="num"><b>${usd(g.cost)}</b></td></tr>`}).join("")):`<p class="empty">${t("noCosts")}</p>`}</section>
   <section class="csec"><h2>${t("byTask")}</h2>${(()=>{const m=new Map();rows.forEach(c=>{const g=m.get(c.task)||{title:c.title,client:c.client,rows:[],h:0,cost:0};g.rows.push(c);g.h+=c.hours;g.cost+=c.cost;m.set(c.task,g)});
     const list=[...m.values()].sort((a,b)=>b.cost-a.cost);if(!list.length)return `<p class="empty">${t("noCosts")}</p>`;

       <table class="ctable"><thead><tr><th scope="col">${t("colStage")}</th><th scope="col">${t("colPerson")}</th><th scope="col" class="num">${t("colHours")}</th><th scope="col" class="num">${t("colRate")}</th><th scope="col" class="num">${t("colCost")}</th></tr></thead>

}

function stageWorkers(s){const w=(s.workers&&s.workers.length)?s.workers:(s.pos?[s.pos]:[]);return w}

function boardItems(uid){return board?(board[uid]||[]):wlogs.filter(l=>l.user===uid).map(l=>({d:l.day,h:l.hours,w:l.wait}))}
function lbStats(u){

  const wk=it.filter(x=>x.d>=WK0&&x.d<=WK6&&x.h>0),last=it.filter(x=>x.d>=lw0&&x.d<=lw6&&x.h>0).length;
  const n=wk.length,kpi=u.kpi||0,pct=kpi?Math.round(n/kpi*100):0,lpct=kpi?Math.round(last/kpi*100):0,hrs=wk.reduce((a,x)=>a+x.h,0);
  // streak: working days (Monday to Saturday) in a row with a finished stage, counting back from today
  const days=new Set(it.filter(x=>x.h>0).map(x=>x.d));let streak=0,d=new Date(TODAY+"T00:00:00");if(!days.has(TODAY))d=addDays(d,-1);
  for(let i=0;i<60;i++){if(d.getDay()===0){d=addDays(d,-1);continue}if(days.has(iso(d))){streak++;d=addDays(d,-1)}else break}
  const ws=it.filter(x=>x.d>=WK0&&x.d<=WK6&&x.w>0),speed=ws.length>=2?ws.reduce((a,x)=>a+x.w,0)/ws.length:null;
  return {u,n,kpi,pct,lpct,hrs,streak,speed,st:[]};
}
function lbAll(){
  const list=people().map(lbStats),ranked=list.filter(s=>s.kpi>0).sort((a,b)=>b.pct-a.pct||b.n-a.n||(a.speed??1e9)-(b.speed??1e9)||a.u.name.localeCompare(b.u.name));

function clientStats(c){
  const ks=tasks.filter(k=>k.client===c.id),open=ks.filter(k=>k.status!=="done"),ms=monthStart();
  const doneM=ks.filter(k=>k.status==="done"&&k.doneAt&&k.doneAt>=ms).length,late=open.filter(k=>k.due&&k.due<TODAY).length;
  const next=open.map(k=>k.due).filter(Boolean).sort()[0]||"";

}

  const counts={};open.forEach(k=>{counts[k.stage]=(counts[k.stage]||0)+1});
  const stages=sortedSt().filter(s=>!s.done&&counts[s.id]);
  const f=k=>(!S.cStage||k.stage===S.cStage)&&(!S.cProj||k.project===S.cProj)&&(!S.cWho||k.to===S.cWho);
  const projs=projects.filter(p=>p.client===c.id),who=[...new Set(all.map(k=>k.to))].map(U).filter(Boolean);
  const list=sortT(open.filter(f));
  return `<div class="stagecounts"><button data-act="cstage" data-v="" aria-pressed="${!S.cStage}">${t("allStages")} <b class="num">${open.length}</b></button>${stages.map(s=>`<button data-act="cstage" data-v="${s.id}" aria-pressed="${S.cStage===s.id}"><span class="kdot sc-${s.color||"gray"}"></span>${esc(nm(s))} <b class="num">${counts[s.id]}</b></button>`).join("")}<span class="donecount">${t("done")} <b class="num">${done.length}</b></span></div>
   <div class="filters"><label class="f">${t("projectT")}<select data-cf="cProj"><option value="">${t("anyProject")}</option>${projs.map(p=>`<option value="${p.id}" ${S.cProj===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f">${t("colPerson")}<select data-cf="cWho"><option value="">${t("anyone")}</option>${who.map(u=>`<option value="${u.id}" ${S.cWho===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></label></div>
   <div class="list">${list.length?list.map(k=>taskCard(k,true)).join(""):`<p class="empty">${t("none")}</p>`}</div>
   ${done.length?`<button class="btn small" data-act="cdone">${S.cShowDone?t("hideDone"):fill(t("showDone"),done.filter(f).length)}</button>${S.cShowDone?`<div class="list">${done.filter(f).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||"")).map(k=>taskCard(k,true)).join("")}</div>`:""}`:""}`;
}
function projStats(p){const ks=tasks.filter(k=>k.project===p.id),done=ks.filter(k=>k.status==="done").length,late=ks.filter(k=>k.status!=="done"&&k.due&&k.due<TODAY).length;
  const ids=new Set(ks.map(k=>k.id)),hrs=wlogs.filter(l=>ids.has(l.task)).reduce((a,l)=>a+l.hours,0);return {ks,done,late,hrs,pct:ks.length?Math.round(done/ks.length*100):0}}

const draftClient=c=>({id:c?c.id:null,name:c?c.name:"",status:c?(c.status||"active"):"active",owner:c?(c.owner||""):"",address:c?(c.address||""):"",notes:c?(c.notes||""):"",

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const mine=["cst","cl-new","cl-open","cl-back","cl-edit","ctab","cstage","cdone","cd-add","cd-rm","cd-save","pj-new","pj-toggle","pj-edit","pj-save","pj-del","ms-add","ms-rm","mt-new","mt-open","mt-save","mt-del","ma-add","ma-rm","mt-maketask","mt-task",
    "wk-new","wk-page","wk-edit","wk-save","wk-del","wk-tpl","guide","guide-back","guide-wiki"];
  if(!mine.includes(a))return;e.preventDefault();e.stopImmediatePropagation();
  const c=CL(S.cid),id=b.dataset.id;
  switch(a){
    case "cst":S.cst=b.dataset.v;render();return;
    case "cl-new":S.dlg={type:"client",draft:draftClient(null)};render();return;
    case "cl-open":S.view="client";S.cid=id;S.ctab="overview";S.cStage="";S.cProj="";S.cWho="";S.wpage="";render();window.scrollTo(0,0);return;
    case "cl-back":S.view="clients";render();return;
    case "cl-edit":S.dlg={type:"client",draft:draftClient(c)};render();return;
    case "ctab":S.ctab=b.dataset.v;render();return;
    case "cstage":S.cStage=b.dataset.v;render();return;
    case "cdone":S.cShowDone=!S.cShowDone;render();return;
    case "cd-add":S.dlg.draft[b.dataset.k].push(b.dataset.k==="contacts"?{name:"",role:"",phone:"",tg:"",email:""}:{label:"",type:"",qty:""});render();return;
    case "cd-rm":S.dlg.draft[b.dataset.k].splice(+b.dataset.i,1);render();return;
    case "cd-save":{const d=S.dlg.draft,er=document.getElementById("cd-err");if(!d.name.trim()){er.textContent=t("clientNameReq");er.hidden=false;return}
      if(!d.id&&clients.some(x=>x.name.toLowerCase()===d.name.trim().toLowerCase())){er.textContent=t("clientDup");er.hidden=false;return}

/* a readable value: names instead of ids, short text */
function aVal(f,v){
  if(v===null||v===undefined||v==="")return "–";
  if(Array.isArray(v))return v.map(x=>aVal(f,x)).join(", ")||"–";
  if(typeof v==="object")return "…";
  if(typeof v==="boolean")return v?"✓":"✗";
  const s=String(v);
  if(["assignee","creator","user","owner","author","del_by","created_by","updated_by","by"].includes(f))return (U(s)||{name:s}).name;
  if(f==="client")return C(s)||s;if(f==="stage")return nm(ST(s))||s;if(f==="type")return nm(TT(s))||s;
  if(f==="project"&&typeof projects!=="undefined"){const p=projects.find(x=>x.id===s);return p?p.name:s}
  if(f==="positions")return nm(PO(s))||s;
  if(/<[a-z]/i.test(s)||s.length>60)return s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,57)+(s.length>60?"…":"");
  return s;
}

/* health: late when past the end date (or 3+ overdue), at risk when anything is overdue or progress lags time */
function projHealth(p,s){
  if(p.status==="done")return "done";if(!s.ks.length)return "new";
  if((p.end&&p.end<TODAY&&s.pct<100)||s.late>=3)return "late";
  if(s.late>0)return "risk";
  if(p.start&&p.end&&p.end>p.start){const span=dayDiff(p.start,p.end),gone=Math.min(span,Math.max(0,dayDiff(p.start,TODAY)));if(gone/span-s.pct/100>0.25)return "risk"}
  return "ontrack";
}
