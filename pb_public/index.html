<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preahchan Tasks</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f4ec">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preahchan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column with bottom navigation; left sidebar from 900px. Single light look, from the Preahchan Tasks design system. */
:root{
  --surface:#f7f4ec; --surface-raised:#ffffff; --ink:#14213d; --ink-muted:#55607a;
  --line:#cfc8b8; --line-strong:#8a8472; --brand:#14213d; --on-brand:#f7f4ec;
  --moon:#f2b632; --moon-soft:#fbe9b7; --done:#0b5f7a; --done-soft:#d9ecf2;
  --overdue:#a33f06; --overdue-soft:#fbe3d0;
  --prio-high:#b3261e; --prio-high-soft:#fbdcd8; --prio-normal:#3d4a6b; --prio-normal-soft:#e3e6ee; --prio-low:#2f6b3a; --prio-low-soft:#dcebd9;
  --note-yellow:#fbe9b7; --note-blue:#d9ecf2; --note-green:#dcebd9; --note-pink:#fbdcd8; --note-lilac:#e7e2f3; --note-white:#ffffff;
  --sans:"Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;
  --r-sm:6px; --r-md:12px; --r-lg:20px; --r-full:999px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font:400 15px/24px var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:40px;font-weight:700;text-wrap:balance}
h2{font-size:20px;line-height:30px;font-weight:600}
h3{font-size:17px;line-height:26px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--ink-muted)} .cap{font-size:12px;line-height:18px} .lab{font-size:13px;line-height:20px;font-weight:600}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:1080px;margin:0 auto;padding-block:16px 96px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:28px;width:auto;display:block}
.top .sp{flex:1}
@media (max-width:599px){.top .sample{order:9}.top::after{content:"";order:8;flex-basis:100%;height:0}}
.sample{background:var(--moon-soft);border-radius:var(--r-full);padding:2px 12px;font-size:12px;line-height:18px}
.who{display:flex;align-items:center;gap:8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}

.btn{min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-raised);font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.small{min-height:36px;padding:0 12px}
.btn.danger{color:var(--overdue);border-color:var(--overdue)}

nav.nav{display:flex;flex-direction:column;gap:4px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px}
nav.nav button{min-height:44px;border:0;background:none;border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--ink-muted);cursor:pointer;text-align:left;padding:0 12px}
.navscrim{position:fixed;inset:0;z-index:14;background:rgba(20,33,61,.25)}
@media (max-width:899px){
  .shell{padding-block:16px 40px}
  nav.nav{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 72px);left:max(16px,env(safe-area-inset-left,0px));width:min(280px,calc(100% - 32px))}
  nav.nav:not(.openmenu){display:none}
}
nav.nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
main{display:flex;flex-direction:column;gap:24px;min-width:0}
@media (min-width:900px){
  .shell{padding-block:32px 48px}
  .body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
  nav.nav{position:static}
  .top .menubtn,.navscrim{display:none}
}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{flex:1;min-width:0}

.kpi{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.kpi .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .big{font-size:40px;line-height:44px;font-weight:700}
.badge{background:var(--moon);color:var(--ink);border-radius:var(--r-full);padding:2px 12px;font-size:13px;font-weight:600;line-height:20px}
.bar{height:8px;border-radius:var(--r-full);background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-full)}
.dots{display:flex;gap:12px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:18px;color:var(--ink-muted)}
.dots b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:block}
.dots b.on{background:var(--brand);border-color:var(--brand)}
.dots b.today{background:var(--moon);border-color:var(--ink)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:36px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:none;font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.list{display:flex;flex-direction:column;gap:12px}
.task{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.task .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:var(--r-sm)}
.task .open h3{overflow-wrap:anywhere}
.task>.btn{flex:none;align-self:center}
.task.isdone h3{text-decoration:line-through;color:var(--ink-muted)}
.check{width:28px;height:28px;margin-top:8px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface-raised);cursor:pointer;flex:none;position:relative}
.check::after{content:"";position:absolute;inset:-9px}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"]::before{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;line-height:18px;color:var(--ink-muted)}
.meta{align-items:center}
.meta .late{color:var(--overdue);font-weight:600}
.pr{border-radius:var(--r-sm);padding:0 8px;font-weight:600}
.pr.high{background:var(--prio-high-soft);color:var(--prio-high)} .pr.normal{background:var(--prio-normal-soft);color:var(--prio-normal)} .pr.low{background:var(--prio-low-soft);color:var(--prio-low)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}
.addrow{display:flex;gap:12px;align-items:end;flex-wrap:wrap} .addrow label{flex:1;min-width:180px}
.chip{flex:none;border-radius:var(--r-full);padding:2px 10px;font-size:12px;line-height:18px;font-weight:600;margin-top:4px;white-space:nowrap}
.chip.todo{border:1px solid var(--line-strong);color:var(--ink-muted)}
.chip.doing{background:var(--moon);color:var(--ink)}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.overdue{background:var(--overdue-soft);color:var(--overdue)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:24px;text-align:center;color:var(--ink-muted)}

.rows{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.rows>.prow:first-child,.rows>div:first-child>.prow{border-top:0}
button.prow{cursor:pointer}
.prow .nm{display:flex;align-items:center;gap:10px;min-width:0}
.prow .nm span{min-width:0;overflow-wrap:anywhere}
.prow.me{background:var(--moon-soft)}
.prow .cnt{white-space:nowrap;text-align:right}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;border:1.5px solid var(--line-strong)}
.rank.first{background:var(--moon);border-color:var(--ink)}
.sub{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--surface)}
.late{color:var(--overdue);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.urow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:16px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
@media (min-width:700px){.urow{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:20px;font-weight:600;min-width:0}
label.c{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:600}
label.c input{width:20px;height:20px;accent-color:var(--brand)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-raised);padding:8px 12px;font-weight:400;font-size:15px;width:100%;max-width:100%}
input[type=number]{width:88px}
textarea{min-height:80px;resize:vertical}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--surface-raised);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92%;overflow:auto;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.dlg{border-radius:var(--r-lg)}}
.dlg form,.dlg .stack{display:flex;flex-direction:column;gap:16px}
.dlg .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.dlg .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.dlg .ttl{display:flex;gap:12px;align-items:flex-start}
.dlg .ttl h2{flex:1;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.cmt{border-top:1px solid var(--line);padding-top:8px}
.cmtadd{display:flex;gap:8px}
.cmtadd input{flex:1;min-width:0}
.err{background:var(--overdue-soft);color:var(--overdue);border-radius:var(--r-md);padding:8px 12px;font-size:13px;font-weight:600}

.login{max-width:400px;margin:0 auto;padding-block:48px;display:flex;flex-direction:column;gap:24px}
.login img{height:40px;width:auto;align-self:flex-start}
.login form{display:flex;flex-direction:column;gap:16px}
.demo{display:flex;flex-direction:column;gap:8px}
.demo button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left}
.stack{display:flex;flex-direction:column;gap:16px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-raised);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--r-full);background:var(--overdue);color:#fff;font-size:12px;line-height:20px;font-weight:700;text-align:center}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none}.avbtn .av{width:44px;height:44px;font-size:15px}
.avbtn[aria-current="page"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--moon)}
.bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar2 h2{flex:1;min-width:0}
.nlist{display:flex;flex-direction:column}
.nitem{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.nitem:first-child{border-top:0}
.ndot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.nitem.unread .ndot{background:var(--brand)}
.ntext{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nlink{background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere;border-radius:var(--r-sm)}
.nlink b,.nmsg b{font-weight:600}
.okline{font-size:13px;line-height:20px;font-weight:600;color:var(--done)}
.conf{color:var(--done);font-weight:600}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.drow:first-child{border-top:0}
.drow .dacts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
@media (min-width:700px){.drow{grid-template-columns:auto minmax(0,1fr) auto}.drow .dacts{grid-column:auto}}
.ftype{width:44px;height:44px;border-radius:var(--r-sm);background:var(--prio-normal-soft);color:var(--prio-normal);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em}
.dname{min-width:0;overflow-wrap:anywhere}
.upl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl label.btn{display:inline-flex;align-items:center;position:relative}
.upl input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.upl label.btn:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.note-hint{font-size:13px;line-height:20px;color:var(--ink-muted)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.note{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nopen{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:var(--r-sm)}
.nopen h3{overflow-wrap:anywhere}
.ntxt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ci{display:flex;gap:8px;align-items:flex-start}
.tick{width:24px;height:24px;flex:none;border-radius:var(--r-sm);border:1.5px solid var(--line-strong);background:var(--surface-raised);cursor:pointer;position:relative;margin-top:0;padding:0}
.tick::after{content:"";position:absolute;inset:-8px}
.tick[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.tick[aria-pressed="true"]::before{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ci>span{overflow-wrap:anywhere;min-width:0}
.ci.ticked>span{text-decoration:line-through;color:var(--ink-muted)}
.nfoot{display:flex;gap:4px 8px;flex-wrap:wrap;font-size:12px;line-height:18px;color:var(--ink-muted);align-items:center}
.tag{background:var(--surface-raised);border-radius:var(--r-sm);padding:0 8px;color:var(--ink);font-weight:600}
.pinmark{font-size:12px;line-height:18px;font-weight:600}
.c-yellow{background:var(--note-yellow)}.c-blue{background:var(--note-blue)}.c-green{background:var(--note-green)}.c-pink{background:var(--note-pink)}.c-lilac{background:var(--note-lilac)}.c-white{background:var(--note-white)}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-strong);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--brand);outline-offset:2px}
.edrow{display:flex;gap:8px;align-items:center}
.edrow input[type=text]{flex:1;min-width:0;min-height:40px}
.ci.edrow.ticked input{text-decoration:line-through;color:var(--ink-muted)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 12px}
input[type=datetime-local]{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-raised);padding:8px 12px;font-weight:400;font-size:15px;width:100%;max-width:100%}
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.code{font-size:28px;line-height:40px;font-weight:700;letter-spacing:.2em}
.chat{background:var(--done-soft);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{background:var(--surface-raised);border-radius:var(--r-md);padding:10px 12px;max-width:440px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg .mt{font-size:12px;line-height:18px;color:var(--ink-muted);align-self:flex-end}
.msg ul{margin:0;padding-left:20px}
.kb{display:flex;gap:6px;flex-wrap:wrap}
.kb button{flex:1 1 120px;min-height:40px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.fab{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 20px 0 16px;border-radius:var(--r-full);border:0;background:var(--moon);color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.fab .fcount{min-width:22px;height:22px;border-radius:var(--r-full);background:var(--ink);color:var(--moon);font-size:12px;line-height:22px;text-align:center;padding:0 6px}
.fab[aria-expanded="true"]{outline:2px solid var(--ink);outline-offset:2px}
.fnpanel{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));max-height:min(65vh,560px);overflow:auto;background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.fnpanel .bar2 h2{font-size:17px;line-height:26px}
.fnpanel form{display:flex;gap:8px}.fnpanel form input{flex:1;min-width:0}
.fnlist{display:flex;flex-direction:column;gap:8px}
.note.mini{padding:12px;gap:6px;border-radius:var(--r-md)}
.note.mini .ntxt{-webkit-line-clamp:3}
.note.mini h3{font-size:15px;line-height:22px}
.more{font-size:12px;line-height:18px;color:var(--ink-muted)}
.shell.hasfab{padding-bottom:96px}
@media (max-width:899px){.fnpanel{max-height:min(50vh,520px)}.shell.hasfab.fnopen{padding-bottom:calc(50vh + 96px)}}
.hrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.hbar i{background:var(--done)}
.hbar.over i{background:var(--overdue)}
.hint-over{color:var(--overdue);font-weight:600}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.6fr) auto;gap:12px;align-items:center;padding:4px 0}
.crow span:first-child{overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;margin-inline:-4px}
table.rtbl{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;line-height:22px}
.rtbl th{text-align:left;font-size:12px;line-height:18px;color:var(--ink-muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line-strong)}
.rtbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rtbl .r{text-align:right;white-space:nowrap}
.rtbl tfoot td{font-weight:700;border-bottom:0}
.rtbl .over{color:var(--overdue);font-weight:600}
.rhead{flex:1;min-width:0}
.rlist{display:none;flex-direction:column}
.rlist>div{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.rlist>div:last-child{border-bottom:0}
@media (max-width:599px){.tblwrap{display:none}.rlist{display:flex}}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.rows>.rrow:first-child{border-top:0}
.fchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;background:var(--surface);font-size:13px;line-height:20px;overflow-wrap:anywhere}
.fchip b{white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--overdue)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--brand);color:var(--on-brand);padding:8px 16px;border-radius:var(--r-full);font-size:13px;font-weight:600;max-width:calc(100% - 32px)}

/* ===== Modern layer: softer elevation, larger radii, motion ===== */
:root{--line-soft:#e9e3d6;--on-brand-muted:#b9c2d6;--done-bright:#7cc7dd;--overdue-bright:#f4a26b;--brand-glow:#2a3d68;
  --sh-sm:0 1px 2px rgba(20,33,61,.06),0 2px 8px rgba(20,33,61,.04);--sh-md:0 6px 20px rgba(20,33,61,.08),0 2px 6px rgba(20,33,61,.05);--sh-lg:0 24px 60px rgba(20,33,61,.22);
  --ease:cubic-bezier(.2,.8,.2,1);--r-md:14px;--r-lg:22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--surface)}
h1{font-size:30px;line-height:40px;letter-spacing:-.02em}
.eyebrow{font-size:13px;line-height:20px;color:var(--ink-muted);font-weight:600}
.head .rhead{flex:1 1 300px}
@media (max-width:599px){.head>.btn{flex:1}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-block:10px;margin-block:-10px;background:rgba(247,244,236,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.task,.kpi,.rows,.card,.note,.fnpanel,nav.nav,.empty{border-color:var(--line-soft)}
.task,.kpi,.rows,.card,nav.nav{box-shadow:var(--sh-sm)}
.note{box-shadow:var(--sh-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.fnpanel{box-shadow:var(--sh-lg);border-color:var(--line-soft)}
.dlg{box-shadow:var(--sh-lg)}
.task{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
@media (hover:hover){.task:hover,.note:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(20,33,61,.28)}
  .btn:not(.primary):hover{background:var(--surface)}
  nav.nav button:not([aria-current]):hover{background:var(--surface);color:var(--ink)}
  .check:hover{border-color:var(--done);box-shadow:0 0 0 4px var(--done-soft)}
  .iconbtn:hover{box-shadow:var(--sh-md)}
  .fab:hover{transform:translateY(-2px)}}
.btn{transition:transform .12s var(--ease),box-shadow .2s var(--ease),background-color .2s}
.btn.primary{box-shadow:0 4px 14px rgba(20,33,61,.22)}
.btn:active,.tabs button:active,.iconbtn:active,.fab:active,.check:active,.tick:active,.kb button:active{transform:scale(.96)}
.tabs button,.check,.tick,.iconbtn,.fab{transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .15s var(--ease)}
.iconbtn{border-color:var(--line-soft);box-shadow:var(--sh-sm)}
.fab{box-shadow:0 10px 26px rgba(20,33,61,.22)}
nav.nav button{display:flex;align-items:center;gap:12px;transition:background-color .2s,color .2s}
.ni{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ncount{margin-left:auto;min-width:22px;height:22px;border-radius:var(--r-full);background:var(--overdue);color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 6px}
nav.nav button[aria-current="page"] .ncount{background:var(--moon);color:var(--ink)}
@media (max-width:899px){nav.nav{top:calc(env(safe-area-inset-top,0px) + 66px);box-shadow:var(--sh-lg)}}
@media (min-width:900px){nav.nav{position:sticky;top:96px}}
.av[data-c="0"]{background:var(--note-yellow);color:var(--ink)}.av[data-c="1"]{background:var(--note-blue);color:var(--ink)}.av[data-c="2"]{background:var(--note-green);color:var(--ink)}
.av[data-c="3"]{background:var(--note-pink);color:var(--ink)}.av[data-c="4"]{background:var(--note-lilac);color:var(--ink)}.av[data-c="5"]{background:var(--brand);color:var(--on-brand)}
/* hero KPI card */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;color:var(--on-brand);background:radial-gradient(130% 120% at 100% 0%,var(--brand-glow) 0%,var(--brand) 60%);box-shadow:var(--sh-md);display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;right:-56px;top:-56px;width:170px;height:170px;border-radius:50%;background:var(--moon);opacity:.12;pointer-events:none}
.hero-top{display:flex;gap:20px;align-items:center;position:relative;z-index:1}
.ringwrap{position:relative;width:112px;height:112px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .prg{stroke:var(--moon);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num .big{font-size:34px;line-height:38px;font-weight:700}
.ring-num .cap{color:var(--on-brand-muted)}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hero .lab{color:var(--on-brand-muted)}
.hero-line{font-size:17px;line-height:26px;font-weight:600}
.togo{font-size:13px;line-height:20px;font-weight:600;color:var(--moon)}
.hero .dots{position:relative;z-index:1}
.hero .dots div{color:var(--on-brand-muted)}
.hero .dots b{border-color:rgba(255,255,255,.4)}
.hero .dots b.on{background:var(--on-brand);border-color:var(--on-brand)}
.hero .dots b.today{background:var(--moon);border-color:var(--moon);box-shadow:0 0 0 3px rgba(242,182,50,.28)}
.hero .hrow{border-top-color:rgba(255,255,255,.16);position:relative;z-index:1}
.hero .bar{background:rgba(255,255,255,.14)}
.hero .hbar i{background:var(--done-bright)}
.hero .hbar.over i{background:var(--overdue-bright)}
.hero .hint{color:var(--on-brand-muted)}
.hero .hint.over{color:var(--overdue-bright);font-weight:600}
@media (max-width:420px){.ringwrap{width:96px;height:96px}.ring-num .big{font-size:28px;line-height:32px}.hero-top{gap:16px}}
.spark{position:absolute;left:calc(50% - 4px);top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--moon);pointer-events:none;animation:spark .9s ease-out both}
/* login */
.login2{max-width:1000px;margin:0 auto;padding-block:24px;display:grid;grid-template-columns:1fr}
.lhero{position:relative;overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0;background:radial-gradient(130% 120% at 100% 0%,var(--brand-glow) 0%,var(--brand) 60%);color:var(--on-brand);padding:28px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.moonart{position:absolute;right:28px;top:26px;width:80px;height:80px;border-radius:50%;background:var(--moon);box-shadow:0 0 0 14px rgba(242,182,50,.12),0 0 0 30px rgba(242,182,50,.06)}
.lname{font-size:28px;line-height:36px;font-weight:700;position:relative}
.ltag{color:var(--on-brand-muted);max-width:30ch;position:relative}
.login2 .login{max-width:none;margin:0;background:var(--surface-raised);border-radius:0 0 var(--r-lg) var(--r-lg);padding:28px;box-shadow:var(--sh-md)}
@media (min-width:860px){.login2{grid-template-columns:1fr 1fr;padding-block:64px}.lhero{border-radius:var(--r-lg) 0 0 var(--r-lg);min-height:600px;padding:44px}
  .moonart{width:150px;height:150px;right:56px;top:56px}.lname{font-size:44px;line-height:52px}.login2 .login{border-radius:0 var(--r-lg) var(--r-lg) 0;padding:48px}}
/* dialogs: grab handle on phones */
.dlg::before{content:"";align-self:center;flex:none;width:40px;height:4px;border-radius:var(--r-full);background:var(--line);margin:-6px 0 2px}
@media (min-width:700px){.dlg::before{display:none}}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes menu{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes checkpop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes leave{to{opacity:0;transform:translateX(28px) scale(.98)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes glow{0%,100%{box-shadow:var(--sh-md)}50%{box-shadow:0 0 0 6px rgba(242,182,50,.4),var(--sh-md)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
main.enter>*{animation:rise .45s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.24s}
main.enter .list>*,main.enter .board>*,main.enter .rows>*{animation:rise .4s var(--ease) both}
main.enter .list>*:nth-child(2),main.enter .board>*:nth-child(2),main.enter .rows>*:nth-child(2){animation-delay:.2s}
main.enter .list>*:nth-child(3),main.enter .board>*:nth-child(3),main.enter .rows>*:nth-child(3){animation-delay:.24s}
main.enter .list>*:nth-child(4),main.enter .board>*:nth-child(4),main.enter .rows>*:nth-child(4){animation-delay:.28s}
main.enter .list>*:nth-child(n+5),main.enter .board>*:nth-child(n+5),main.enter .rows>*:nth-child(n+5){animation-delay:.32s}
main.enter .bar i{transform-origin:left;animation:grow .9s var(--ease) both .2s}
main.enter .ring .prg{animation:ring 1.1s var(--ease) both .15s}
.scrim.enter{animation:fade .2s ease both}
.scrim.enter .dlg{animation:sheet .34s var(--ease) both}
@media (min-width:700px){.scrim.enter .dlg{animation:pop .26s var(--ease) both}}
nav.nav.openmenu.enter{animation:menu .22s var(--ease) both;transform-origin:top left}
.navscrim.enter{animation:fade .2s ease both}
.fnpanel.enter{animation:pop .26s var(--ease) both;transform-origin:bottom right}
.toast:not([hidden]){animation:toastin .32s var(--ease) both}
.bump{display:inline-block;animation:bump .55s var(--ease)}
.task.completing{animation:leave .35s var(--ease) .3s both;pointer-events:none}
.task.completing .check{background:var(--done);border-color:var(--done);animation:checkpop .3s var(--ease)}
.task.completing .check::before{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task.completing h3{text-decoration:line-through;color:var(--ink-muted)}
.hero.celebrate{animation:glow 1.1s ease 2}
.login2.enter>*{animation:rise .5s var(--ease) both}.login2.enter>*:nth-child(2){animation-delay:.08s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* elements marked hidden stay hidden even when a class sets display */
[hidden]{display:none!important}
/* ===== Workflow: status colours, Kanban, Settings ===== */
.sc-gray{background:#e3e6ee;color:#3d4a6b}.sc-blue{background:#d9ecf2;color:#0b5f7a}.sc-purple{background:#e7e2f3;color:#4b3a8a}
.sc-orange{background:#fbe3d0;color:#a33f06}.sc-yellow{background:#fbe9b7;color:#6b4a00}.sc-pink{background:#fbdcd8;color:#9b2335}
.sc-teal{background:#d5efe9;color:#1d6b5c}.sc-navy{background:#14213d;color:#f7f4ec}.sc-green{background:#dcebd9;color:#2f6b3a}.sc-red{background:#f8d3cf;color:#b3261e}
.chip[class*="sc-"]{border:0}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.kboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.kcol{background:#efeadf;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;scroll-snap-align:start;transition:background-color .2s,box-shadow .2s}
.kcol.dropok{background:var(--moon-soft);box-shadow:inset 0 0 0 2px var(--moon)}
.kcol header{display:flex;align-items:center;gap:8px;padding:2px 4px;flex-wrap:wrap}
.kcol header b{flex:1;min-width:0;font-size:14px;line-height:20px}
.kdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.kcount{min-width:24px;height:22px;border-radius:999px;background:var(--surface-raised);font-size:12px;line-height:22px;text-align:center;font-weight:700;padding:0 6px}
.kitems{display:flex;flex-direction:column;gap:8px}
.kempty{min-height:40px;border:1px dashed var(--line);border-radius:var(--r-md);margin:0}
.kother{background:#e9e6ef}
.kcard{background:var(--surface-raised);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease),opacity .2s}
.kcard[draggable=true]{cursor:grab}
.kcard.dragging{opacity:.45}
.kcard.isover{border-left:0;box-shadow:var(--sh-sm),inset 0 0 0 1px var(--overdue-soft)}
@media (hover:hover){.kcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}}
.kcard .open{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:var(--r-sm)}
.kcard .open b{font-size:15px;line-height:22px;overflow-wrap:anywhere}
.kwho{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--ink-muted);flex-wrap:wrap}
.kwho .av{width:22px;height:22px;font-size:10px}
.kmove{min-height:34px!important;font-size:13px!important;padding:4px 8px!important}
.srow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-soft)}
.rows>.srow:first-child{border-top:0}
.sname{flex:1;min-width:0;overflow-wrap:anywhere}
.sacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.iconbtn.sm{width:34px;height:34px}.iconbtn.sm svg{width:18px;height:18px}.iconbtn:disabled{opacity:.35;cursor:default}
.flowline{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.flowline .chip{margin:0}
.arr{color:var(--ink-muted);font-weight:700}
.pchips{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pchips .tag{background:var(--note-blue);font-size:12px;line-height:20px;font-weight:600}
.hopick{display:flex!important;align-items:center;gap:10px;justify-content:flex-start;text-align:left;min-height:52px!important}

/* ===== Rich text and attachments ===== */
.rt{border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-raised);overflow:hidden}
.rt:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.rt-bar{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.rtb{width:34px;height:34px;border:0;border-radius:8px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.rtb:hover{background:var(--surface-raised)}
.rtb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rtsep{width:1px;background:var(--line);margin:4px 3px}
.rt-area{min-height:120px;max-height:320px;overflow:auto;padding:10px 12px;outline:none;font-size:15px;line-height:24px;overflow-wrap:anywhere}
.rt-area:empty::before{content:attr(aria-label);color:var(--ink-muted)}
.rt-area h3,.rt-view h3{font-size:17px;line-height:26px;margin:6px 0 2px}
.rt-area p,.rt-view p,.rt-area div,.rt-view div{margin:0 0 4px}
.rt-area ul,.rt-area ol,.rt-view ul,.rt-view ol{margin:4px 0;padding-left:22px}
.rt-area blockquote,.rt-view blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--moon);background:var(--surface);border-radius:0 8px 8px 0}
.rt-area a,.rt-view a{color:var(--done);text-decoration:underline}
.rt-view{background:var(--surface);border-radius:var(--r-md);padding:10px 12px;overflow-wrap:anywhere;font-size:15px;line-height:24px}
.row-acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.atts{columns:2 170px;column-gap:8px}
.atts>.att{break-inside:avoid;margin-bottom:8px}
.att{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.att img{width:100%;height:auto;max-height:420px;object-fit:cover;display:block;background:var(--surface)}
.att video{width:100%;height:160px;object-fit:cover;display:block;background:#000}
.attmeta{display:flex;flex-direction:column;gap:2px;padding:6px 8px;min-width:0}
.attmeta .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attmeta .btn{align-self:flex-start;margin-top:4px}
.att-pend{flex-direction:row;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.att-link svg{width:18px;height:18px;fill:none;stroke:var(--done);stroke-width:2;stroke-linecap:round;flex:none}
.att-link a{color:var(--done);font-weight:600;overflow-wrap:anywhere;flex:1;min-width:0}
.att-pend .cap{flex:1;min-width:0;overflow-wrap:anywhere}
.attadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.attadd label.btn{display:inline-flex;align-items:center;cursor:pointer}
.attadd input[type=url]{flex:1;min-width:160px;min-height:36px;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 10px;font-size:14px;background:var(--surface-raised)}
.attc{display:inline-flex;align-items:center;gap:2px}.attc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.att-card .ptitle{font-weight:600;font-size:13px;line-height:18px;color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.att-card .ptitle:hover{text-decoration:underline}
.att-card .psite{display:flex;align-items:center;gap:4px}
.att-card .psite svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.att-card .pcover{display:block}
.rt-tbl{display:flex;flex-wrap:wrap;gap:2px;width:100%;padding-top:4px;border-top:1px dashed var(--line)}
.rtt{min-height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-raised);font-size:12px;font-weight:600;cursor:pointer}
.rtt:hover{background:var(--moon-soft)}
.rt-area table,.rt-view table{border-collapse:collapse;margin:8px 0;min-width:60%;font-size:14px;line-height:20px}
.rt-area th,.rt-area td,.rt-view th,.rt-view td{border:1px solid var(--line-strong);padding:6px 10px;text-align:left;vertical-align:top;min-width:60px}
.rt-area th,.rt-view th{background:var(--surface);font-weight:700}
.rt-area td:focus-within,.rt-area th:focus-within{background:var(--moon-soft)}
.rt-view{overflow-x:auto}
.kcover{width:calc(100% + 24px);margin:-10px -12px 0;max-height:180px;object-fit:cover;border-radius:var(--r-md) var(--r-md) 0 0;display:block;background:var(--surface)}

.rtb-wide{width:auto;gap:6px;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.rt-tpl{border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:10px;animation:fade .15s ease}
.tpl-head{display:flex;justify-content:space-between;align-items:center}
.tpl-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.tpl-row{display:flex;gap:6px;align-items:stretch}
.tpl-ins{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-raised);cursor:pointer;font:inherit}
.tpl-ins:hover{background:var(--moon-soft)}
.tpl-del{min-width:36px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-raised);font-size:18px;line-height:1;cursor:pointer;color:var(--ink-muted,inherit)}
.tpl-del:hover{background:var(--moon-soft)}
.tpl-save{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.tpl-form{display:flex;gap:6px;flex-wrap:wrap}
.tpl-form input,.tpl-form select{flex:1 1 160px;min-height:36px}

.dlg [aria-invalid="true"]{border-color:var(--danger,#c0392b)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger,#c0392b) 18%,transparent)}
.dlg select:invalid{color:var(--ink-muted,#6b7280)}
.dlg select option{color:var(--ink)}

/* Users: keep the name column readable; the controls wrap instead of squeezing it */
@media (min-width:700px){.urow{grid-template-columns:minmax(220px,1fr) minmax(0,auto)}}
@media (min-width:700px) and (max-width:1100px){.urow{grid-template-columns:minmax(0,1fr)}}
.urow .nm b,.urow .nm .cap{overflow-wrap:anywhere;word-break:normal}
.urow .pchips{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.urow .pchips .tag{white-space:nowrap}
.urow .ctl{justify-content:flex-start}

/* Costs */
.crange{display:flex;gap:12px;flex-wrap:wrap}
.crange .f{flex:0 1 200px}
.csec{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.csec h2{font-size:18px;line-height:24px;margin:0}
.ctable-wrap{overflow-x:auto;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg,16px)}
.ctable{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
.ctable th,.ctable td{padding:10px 14px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.ctable thead th{border-top:0;font-size:12px;font-weight:700;color:var(--ink-muted,inherit);background:var(--surface)}
.ctable tbody th{font-weight:600;white-space:normal;min-width:140px}
.ctable .num{text-align:right;font-variant-numeric:tabular-nums}
.cbar{display:block;width:120px;height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--moon,#1d2a44);border-radius:99px}
.tag.warn{background:#fdecd3;color:#8a4b00}
.salrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.salrow:first-child{border-top:0}

/* Install app button (top bar) */
.installbtn{display:inline-flex;align-items:center;gap:6px}
.installbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.installbtn span{display:none}.installbtn{padding:0 10px}}
.installsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;line-height:22px}

/* Rename and delete requests */
.ttlr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.renamef{display:flex;flex-direction:column;gap:8px}
.delbanner{background:var(--overdue-soft);color:var(--ink);border:1px solid #e9b48c;border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.delbanner p{margin:0;line-height:22px}
.delchip{background:var(--overdue-soft);color:var(--overdue);border-radius:var(--r-full);padding:0 8px;font-weight:700;font-size:12px}
.reqdel{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.reqdel textarea{width:100%;font:inherit}
.acts .spacer{flex:1}

/* Stage plan, timeline, finish */
.planbox{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.plhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.plcrew{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plcrew select{min-height:34px;max-width:220px}
.plrows{display:flex;flex-direction:column;gap:6px}
.plrow{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 76px;gap:8px;align-items:center}
.plrow .chip{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow select,.plrow input{min-height:38px;width:100%}
.plhint{text-align:center}
@media (max-width:560px){.plrow{grid-template-columns:1fr 76px}.plrow .chip{grid-column:1/-1}}
.stagebox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface)}
.sbhead{display:flex;justify-content:space-between;align-items:center}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;position:relative;padding-bottom:10px}
.tl:not(:last-child)::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.tldot{width:14px;height:14px;border-radius:50%;margin-top:3px;border:2px solid var(--surface-raised);box-shadow:0 0 0 1px var(--line-strong)}
.tl.next .tldot{opacity:.35}
.tl.cur .tldot{box-shadow:0 0 0 3px var(--moon)}
.tlbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.tlname{font-weight:700;font-size:14px}
.tl.next .tlname{color:var(--ink-muted)}
.tlwho{font-size:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tlwho select{min-height:34px;max-width:100%}
.tllogs{list-style:none;margin:0;padding:0;font-size:13px;line-height:20px;display:flex;flex-direction:column;gap:2px}
.nowtag{background:var(--moon-soft);border-radius:var(--r-full);padding:0 8px;font-size:12px;font-weight:700}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--ink);text-decoration:underline;font:inherit;font-weight:600;cursor:pointer}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.finishbtn{align-self:stretch}
.finishmini{margin-top:6px;width:100%}
.okline{margin:0}
.wknav{display:flex;align-items:center;gap:12px}
.tsheet td,.tsheet th{padding:8px 10px}
.tsheet th.today{background:var(--moon-soft)}
.tsheet td.under{color:var(--overdue)}
.ctasks{display:flex;flex-direction:column;gap:6px}
.ctask{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.ctask summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;flex-wrap:wrap}
.ctask table{margin-top:8px}

/* Leaderboard */
.lbme{display:flex;gap:20px;align-items:center;padding:20px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--brand),#2a3a63);color:var(--on-brand);box-shadow:0 10px 30px rgba(20,33,61,.18);animation:rise .5s var(--ease,ease) both}
.lbring{--p:0;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--moon) calc(var(--p)*1%),rgba(255,255,255,.15) 0)}
.lbring b{width:76px;height:76px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:22px}
.lbmetext{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbmetext .eyebrow{color:var(--moon);margin:0}
.lbmetext b{font-size:18px;line-height:24px}
.lbmetext .muted{color:rgba(247,244,236,.75)}
.lbme .stk{background:rgba(255,255,255,.12);color:var(--on-brand);border-color:rgba(255,255,255,.2)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-top:4px}
.pod{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:18px 10px 0;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--surface-raised);border:1px solid var(--line);border-bottom:0;animation:rise .6s var(--ease,ease) both}
.pod.p1{padding-top:26px;background:linear-gradient(180deg,#fff8e1,var(--surface-raised));border-color:#e9cf7a;animation-delay:.05s}
.pod.p2{animation-delay:.15s}.pod.p3{animation-delay:.25s}
.pod.me{box-shadow:0 0 0 2px var(--moon)}
.medal{font-size:28px;line-height:1}
.pname{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ppct{font-size:28px;font-weight:800;line-height:32px}
.pod.p1 .ppct{font-size:34px;line-height:40px}
.pod .step{width:100%;margin-top:10px;border-radius:12px 12px 0 0;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:20px;display:grid;place-items:center;height:44px}
.pod.p1 .step{height:72px;background:linear-gradient(180deg,var(--moon),#d99a12);color:var(--brand)}
.pod.p2 .step{height:56px}
.lbav{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--moon-soft);color:var(--ink)}
.lbav.lg{width:56px;height:56px;font-size:18px;box-shadow:0 0 0 3px var(--surface-raised),0 0 0 5px var(--line)}
.pod.p1 .lbav.lg{box-shadow:0 0 0 3px var(--surface-raised),0 0 0 5px var(--moon)}
.lbrows{display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.lbrow{display:grid;grid-template-columns:28px 36px minmax(0,1.3fr) minmax(80px,1fr) 92px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}
.lbrow.me{background:var(--moon-soft)}
.lbrank{font-weight:800;text-align:center;color:var(--ink-muted)}
.lbname{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.lbbar i{display:block;height:100%;border-radius:99px;background:var(--brand);transform-origin:left;animation:grow .9s var(--ease,ease) both .2s}
.lbbar.full i{background:linear-gradient(90deg,var(--moon),#f08c1a)}
.lbpct{display:flex;flex-direction:column;align-items:flex-end;line-height:18px}
.lbpct b{font-size:18px;line-height:22px}
.stks{display:flex;flex-wrap:wrap;gap:4px}
.stk{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;white-space:nowrap}
.stk.big{font-size:13px;padding:3px 10px}
.stk.off{opacity:.45}
.lblegend{display:flex;flex-direction:column;gap:8px}
.lblegend .stk{white-space:normal}
@media (max-width:620px){.lbrow{grid-template-columns:24px 32px minmax(0,1fr) 72px}.lbrow .lbbar{grid-column:3/5;grid-row:2}.lbme{flex-direction:column;text-align:center}.lbmetext .stks{justify-content:center}.podium{gap:6px}.pod{padding-left:4px;padding-right:4px}.ppct{font-size:22px}.pod.p1 .ppct{font-size:26px}}

@media (max-width:620px){.lbrow .stkl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.lbrow .stk{padding:2px 6px;font-size:14px}
 .lblegend .stks{flex-direction:column;align-items:stretch}.lblegend .stk{border-radius:12px;padding:6px 10px}}
.lbrow.me .lbav{background:var(--surface-raised);box-shadow:0 0 0 2px var(--moon)}

/* Dark mode: chosen in Account (Automatic follows the device) */
:root[data-theme="dark"]{--surface:#0f131b;--surface-raised:#181e2a;--ink:#e8ebf2;--ink-muted:#9aa3b8;--line:#2a3242;--line-strong:#4a556d;
  --brand:#2f4374;--on-brand:#f4f1e8;--moon:#f2b632;--moon-soft:#3b3116;--done:#7cc7dd;--done-soft:#133845;--overdue:#f4a26b;--overdue-soft:#43260f;
  --prio-high:#f2867c;--prio-high-soft:#4a1f1b;--prio-normal:#b9c2d6;--prio-normal-soft:#283046;--prio-low:#8fd19a;--prio-low-soft:#1d3322;
  --note-yellow:#3b3116;--note-blue:#133845;--note-green:#1d3322;--note-pink:#43202a;--note-lilac:#2c2640;--note-white:#1f2533;
  --line-soft:#232a39;--on-brand-muted:#b9c2d6;--brand-glow:#3d5596;color-scheme:dark;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#0f131b;--surface-raised:#181e2a;--ink:#e8ebf2;--ink-muted:#9aa3b8;--line:#2a3242;--line-strong:#4a556d;
  --brand:#2f4374;--on-brand:#f4f1e8;--moon:#f2b632;--moon-soft:#3b3116;--done:#7cc7dd;--done-soft:#133845;--overdue:#f4a26b;--overdue-soft:#43260f;
  --prio-high:#f2867c;--prio-high-soft:#4a1f1b;--prio-normal:#b9c2d6;--prio-normal-soft:#283046;--prio-low:#8fd19a;--prio-low-soft:#1d3322;
  --note-yellow:#3b3116;--note-blue:#133845;--note-green:#1d3322;--note-pink:#43202a;--note-lilac:#2c2640;--note-white:#1f2533;
  --line-soft:#232a39;--on-brand-muted:#b9c2d6;--brand-glow:#3d5596;color-scheme:dark;}}

:root:not([data-theme="light"]) .sc-blue{background:#133845;color:#7cc7dd}

/* Profile photos */
.av,.lbav{overflow:hidden}
.avimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.av.big{width:72px;height:72px;font-size:24px;flex:none}
.photorow{display:flex;gap:16px;align-items:center}
.photobtn{cursor:pointer}

:root[data-theme="dark"] .top{background:rgba(15,19,27,.86)}
:root[data-theme="dark"] .top img[alt^="Preahchan"]{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) .top{background:rgba(15,19,27,.86)}
:root:not([data-theme="light"]) .top img[alt^="Preahchan"]{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
}

/* Clients */
.cbar2{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cbar2 input{flex:1 1 220px;min-height:42px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface-raised);cursor:pointer;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s;animation:rise .4s var(--ease,ease) both}
.ccard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,33,61,.1)}
.cctop{display:flex;gap:12px;align-items:center;min-width:0}
.ccname{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.ccname b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ccnums{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.ccnums b{font-size:18px}
.clogo{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--moon-soft);font-weight:800;overflow:hidden;color:var(--ink)}
.clogo img{width:100%;height:100%;object-fit:cover}
.clogo.lg{width:64px;height:64px;border-radius:16px;font-size:22px}
.cstat{display:inline-block;border-radius:var(--r-full);padding:0 8px;font-size:12px;font-weight:700;line-height:20px}
.cs-active{background:var(--done-soft);color:var(--done)}.cs-paused{background:var(--moon-soft);color:var(--ink)}.cs-ended,.cs-done{background:var(--prio-normal-soft);color:var(--prio-normal)}
.backlink{align-self:flex-start;color:var(--ink-muted);text-decoration:none}
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chead .rhead{flex:1;min-width:0}
.chmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.ctabs button{white-space:nowrap}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.pkgs{display:flex;flex-direction:column;gap:10px}
.pkg{display:flex;flex-direction:column;gap:6px}
.contacts{display:flex;flex-direction:column;gap:10px}
.contact{display:flex;flex-direction:column;gap:2px}
.contact a{color:var(--ink)}
.stagecounts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stagecounts button{display:inline-flex;gap:6px;align-items:center;min-height:34px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--line-strong);background:var(--surface-raised);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.stagecounts button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.donecount{font-size:13px;color:var(--ink-muted);margin-left:6px}
.projs{display:flex;flex-direction:column;gap:10px}
.proj{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface-raised)}
.projhead{display:flex;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;flex-wrap:wrap}
.projnums{display:flex;flex-direction:column;align-items:flex-end}
.projnums b{font-size:22px}
.budgetbar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.budgetbar i{display:block;height:100%;background:var(--done)}
.budgetbar.over i{background:var(--overdue)}
.mrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 16px;border:0;border-top:1px solid var(--line);background:var(--surface-raised);font:inherit;color:inherit;cursor:pointer;width:100%}
.rows>.mrow:first-child{border-top:0}
.mdate{font-weight:700;color:var(--ink-muted)}
.erow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;padding:8px;border:1px dashed var(--line);border-radius:var(--r-md)}
.arow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.arow input[type=text]{min-height:38px}
.actlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.actlist .isdone{color:var(--ink-muted);text-decoration:line-through}
.wiki{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.wikinav{display:flex;flex-direction:column;gap:4px;position:sticky;top:90px}
.wikinav .lab{margin-top:8px}
.wikinav button{text-align:left;padding:8px 10px;border-radius:10px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.wikinav button[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.wikipage{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wphead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wphead h2{margin:0}
.guidepage{border-top:1px solid var(--line);padding-top:12px}
@media (max-width:720px){.wiki{grid-template-columns:1fr}.wikinav{position:static;flex-direction:row;flex-wrap:wrap}.wikinav .lab{width:100%}}
.cbar2 input{border:1px solid var(--line-strong);border-radius:var(--r-full);padding:0 16px;background:var(--surface-raised);color:var(--ink);font:inherit}
.ccnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ccnums>span{display:flex;flex-direction:column;line-height:18px;color:var(--ink-muted)}
.ccnums b{color:var(--ink);font-size:20px;line-height:26px}
.ccnums .late b{color:var(--overdue)}

/* Activity log and recycle bin */
.arows{display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.arow2{display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"av who btn" "av title btn" "av when btn" "av chg chg";column-gap:12px;row-gap:2px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.arow2:first-child{border-top:0}
.arow2>.av{grid-area:av;align-self:start}
.arow2 .awho{grid-area:who;font-size:14px}
.arow2 .atitle{grid-area:title;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.arow2>.cap{grid-area:when}
.arow2>.btn{grid-area:btn}
.achgs{grid-area:chg;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px}
.achg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.filters .f input[type=search]{min-height:44px;border:1px solid var(--line-strong);border-radius:12px;padding:0 14px;background:var(--surface-raised);color:var(--ink);font:inherit;width:100%}

/* Projects */
.cbar2 select{min-height:40px;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:0 14px;background:var(--surface-raised);color:var(--ink);font:inherit}
.pcard .ccname b{white-space:normal}
.pchips2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pprog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.pprog b{font-size:18px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.avstack{display:flex}
.avstack .av{width:28px;height:28px;font-size:11px;margin-left:-6px;box-shadow:0 0 0 2px var(--surface-raised)}
.avstack .av:first-child{margin-left:0}
.avstack .av.more{background:var(--surface);color:var(--ink-muted)}
.hchip{display:inline-block;border-radius:var(--r-full);padding:0 10px;font-size:12px;font-weight:700;line-height:22px}
.h-ontrack{background:var(--prio-low-soft);color:var(--prio-low)}.h-risk{background:var(--moon-soft);color:var(--ink)}.h-late{background:var(--prio-high-soft);color:var(--prio-high)}
.h-new{background:var(--prio-normal-soft);color:var(--prio-normal)}.h-done{background:var(--done-soft);color:var(--done)}
.pgoal{margin:0;font-size:15px;line-height:24px}
.msrows{display:flex;flex-direction:column;gap:12px}
.msrow{display:grid;grid-template-columns:14px minmax(0,1.2fr) minmax(80px,1fr) 48px;gap:12px;align-items:center}
.msdot{width:12px;height:12px;border-radius:50%;background:var(--line-strong)}
.msdot.ok{background:var(--prio-low)}.msdot.bad{background:var(--prio-high)}
.msrow b.num{text-align:right}
.pppl{display:flex;flex-direction:column;gap:8px}
.pplrow{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface-raised);font-size:13px;font-weight:600}
.pchip .av{width:26px;height:26px;font-size:10px}
.phead2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead2 h2{margin:0}
.msh{margin:8px 0 0;font-size:15px;color:var(--ink-muted)}
.ppl.col{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.arow.ms{grid-template-columns:20px minmax(0,1fr) 160px auto}
@media (max-width:560px){.msrow{grid-template-columns:14px minmax(0,1fr) 48px}.msrow .lbbar{grid-column:2/4}.arow.ms{grid-template-columns:20px minmax(0,1fr) auto}.arow.ms input[type=date]{grid-column:2/3}}
.cbar2 select{flex:0 1 260px}
.cbar2 label.c{white-space:nowrap;display:inline-flex;align-items:center;gap:8px}

/* Repeat choice */
.repf{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.repf>.f{flex:0 1 220px}
.repc{display:flex;gap:8px;align-items:center}
.repc input{width:76px;min-height:44px}
.repc select{min-height:44px}
</style>

</head>

  else if(a==="clearf")S.fDue=S.fPrio=S.fClient="any";
  else if(a==="expand")S.expand=S.expand===id?null:id;

async function makePdf(uid,wk,repId,btn){

  const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-10000px;top:0;z-index:-1";
  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
    const r=repId?reports.find(x=>x.id===repId):null,sn=r?r.snap:buildReport(uid,wk);
    holder.innerHTML=pdfPage(uid,wk,r,sn);document.body.appendChild(holder);
    try{await document.fonts.ready}catch(e){}
    const canvas=await window.html2canvas(holder.firstElementChild,{scale:2,backgroundColor:"#ffffff",logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPt=canvas.width/pw,pageH=Math.floor(ph*pxPerPt);

      const sh=Math.min(pageH,canvas.height-y),c=document.createElement("canvas");c.width=canvas.width;c.height=sh;
      const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,sh);ctx.drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,sh/pxPerPt);
    }
    const blob=pdf.output("blob");
    try{await DL.save({filename:pdfName(uid,wk),data:blob});toast(t("pdfSaved"))}
    catch(err){const c=err&&err.code;if(c==="declined"){}else if(c==="rate_limited")toast(t("pdfMaking"));else if(["unavailable","not_granted","capability_disabled","capability_removed"].includes(c)){DL=null;render()}else toast(t("pdfFail"))}
  }catch(e){toast(t("pdfFail"))}
  finally{holder.remove();pdfBusy=false;btn.disabled=false}
}

function chat(){
  const m=me(),mine=tasks.filter(k=>k.to===S.me),open=mine.filter(k=>k.status!=="done");
  const msg=(time,body,kb)=>`<div class="msg">${body}${kb?`<div class="kb">${kb}</div>`:""}<span class="mt">${time}</span></div>`;
  const acts=k=>k.status==="done"?"":`${k.status==="todo"?`<button data-act="tg-start" data-id="${k.id}">${t("bStart")}</button>`:""}<button data-act="tg-done" data-id="${k.id}">${t("markDone")}</button>`;
  const state=k=>k.status==="done"?`<p class="okline">${t("bMarked")}</p>`:k.status==="doing"?`<p class="cap muted">${t("bStarted")}</p>`:"";
  const out=[];
  if(m.role!=="admin"){const n=doneWeek(S.me).length;
    out.push(msg(fmt(lastFri)+", 17:00",`<p>${fill(t("bKpi"),fmt(WK0)+" – "+fmt(WK6),"<b>"+n+" "+t("of")+" "+m.kpi+"</b>")}</p><p>${n>=m.kpi?t("bReached"):fill(t("bShort"),m.kpi-n)}</p>${kpiConf[S.me]?`<p class="okline">${t("confirmedOn")} ${fmtAt(kpiConf[S.me])}</p>`:""}`,
      kpiConf[S.me]?"":`<button data-act="kpi-confirm">${t("confirmKpi")}</button>`))}
  const day=open.filter(k=>k.due<=TODAY).sort((a,b)=>a.due.localeCompare(b.due));
  out.push(msg(fmt(TODAY)+", 08:00",`<p>${fill(t("bMorning"),esc(m.name))}</p>${day.length?`<ul>${day.map(k=>`<li>${esc(k.title)}${k.due<TODAY?` <span class="late">(${t("overdue")})</span>`:""}</li>`).join("")}</ul>`:`<p>${t("bNothing")}</p>`}`,`<button data-act="tg-open">${t("bOpen")}</button>`));
  if(m.role!=="staff"){const late=tasks.filter(k=>k.status!=="done"&&k.due<TODAY&&k.to!==S.me&&U(k.to).role!=="admin"&&U(k.to).active);
    out.push(msg(fmt(TODAY)+", 08:05",late.length?`<p>${t("bTeam")}</p><ul>${late.map(k=>`<li>${esc(U(k.to).name)}: ${esc(k.title)}</li>`).join("")}</ul>`:`<p>${t("bTeamOk")}</p>`,""))}
  if(!tgPick[S.me]){const nk=mine.filter(k=>k.by!==S.me&&k.status!=="done").slice(-1)[0],rk=open.find(k=>k.due===off(1)&&k!==nk);tgPick[S.me]={nk:nk?.id,rk:rk?.id}}
  const nk=tasks.find(k=>k.id===tgPick[S.me].nk),rk=tasks.find(k=>k.id===tgPick[S.me].rk);
  if(nk)out.push(msg(fmt(TODAY)+", 09:15",`<p>${fill(t("bNew"),esc(U(nk.by).name),"<b>"+esc(nk.title)+"</b>")}</p><p class="cap muted">${dueText(nk)}</p>${state(nk)}`,acts(nk)));
  if(rk)out.push(msg(fmt(TODAY)+", 16:00",`<p>${fill(t("bRemind"),"","<b>"+esc(rk.title)+"</b>")}</p>${state(rk)}`,acts(rk)));
  {const mr=reports.filter(x=>x.uid===S.me).slice(-1)[0];if(mr){
    out.push(msg(fmtAt(mr.at),`<p>${fill(t("bRepSent"),wkLabel(mr.wk),approversOf(S.me).map(x=>esc(U(x).name)).join(", "))}</p><div class="fchip"><b>PDF</b><span>${esc(pdfName(mr.uid,mr.wk))}</span></div>`,""));
    if(mr.status==="approved")out.push(msg(fmtAt(mr.at2),`<p>${fill(t("bRepOk"),esc(U(mr.by).name),wkLabel(mr.wk))}</p>`,""));
    if(mr.status==="returned")out.push(msg(fmtAt(mr.at2),`<p>${fill(t("bRepBack"),esc(U(mr.by).name),"<b>"+esc(mr.comment)+"</b>")}</p>`,`<button data-act="rep-open" data-id="${mr.id}">${t("bOpen")}</button>`))}}
  reports.filter(r=>r.status==="pending"&&canDecide(r)).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,2).reverse().forEach(r=>out.push(msg(fmtAt(r.at),`<p>${fill(t("bRep"),"<b>"+esc(U(r.uid).name)+"</b>",fill(t("nTasksH"),r.snap.items.length,fh(r.snap.items.reduce((a,x)=>a+x.spent,0))))}</p><div class="fchip"><b>PDF</b><span>${esc(pdfName(r.uid,r.wk))}</span></div>${r.note?`<p class="cap muted">${t("noteMgr")}: ${esc(r.note)}</p>`:""}`,`<button data-act="rep-ok" data-id="${r.id}">${t("approve")}</button><button data-act="rep-open" data-id="${r.id}">${t("review")}</button>`)));
  const nr=notes.filter(n=>n.owner===S.me&&n.remind).sort((a,b)=>a.remind.localeCompare(b.remind))[0];
  if(nr)out.push(msg(fmtAt(nr.remind),`<p>${fill(t("bNote"),"","<b>"+esc(nr.title||t("notes"))+"</b>")}</p>`,""));
  return `<div class="chat">${out.join("")}</div>`;
}

function extClick(a,b,id){

   case "toggle":{const k=tasks.find(x=>x.id===id);if(k.status==="done"){k.status="todo";k.doneAt=null;k.spent=null}else S.dlg={type:"log",id};break}

   case "lg-cancel":S.dlg=S.dlg.back?{type:"task",id:S.dlg.id,focused:true}:null;break;

   case "rep-open":S.view="report";S.repId=id;break;
   case "repwk":S.repWk=b.dataset.v;break;
   case "rtab":S.rTab=b.dataset.v;break;
   case "rep-pdf":makePdf(b.dataset.uid,b.dataset.wk,b.dataset.rep,b);return true;

     const r={id:"r"+(++rid),uid:S.me,wk,snap:buildReport(S.me,wk),note,status:"pending",at:stamp()};reports.push(r);

    const pxPerPt=canvas.width/pw,pageH=Math.floor(ph*pxPerPt);
    for(let y=0,i=0;y<canvas.height;y+=pageH,i++){
      const sh=Math.min(pageH,canvas.height-y),c=document.createElement("canvas");c.width=canvas.width;c.height=sh;
      const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,sh);ctx.drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,sh/pxPerPt);
    }
    return pdf.output("blob");
  }finally{holder.remove()}
}

/* Notes */
async function saveNoteLive(){
  const d=S.dlg.draft,pending=document.getElementById("nd-new")?.value.trim();if(pending)d.items.push({t:pending,done:false});
  d.items=d.items.filter(x=>x.t.trim());
  if(!d.title.trim()&&!d.text.trim()&&!d.items.length){S.dlg=null;render();return}
  const orig=d.id?notes.find(x=>x.id===d.id):null;
  const data={title:d.title.trim(),text:d.text,items:d.items.map(x=>({t:x.t.trim(),done:!!x.done,task:!!x.task})),color:d.color||"yellow",pinned:!!d.pinned,label:(d.label||"").trim(),remind:d.remind||""};
  if(!orig||orig.remind!==data.remind)data.reminded=false;
  if(!orig||orig.owner===S.me){data.owner=d.owner||S.me;data.share=d.share||"private";data.people=d.share==="people"?d.people:[]}
  S.dlg=null;S.arm=null;
  await run(()=>orig?pb.collection("notes").update(d.id,data):pb.collection("notes").create(data),t("noteSaved"));
}

/* Hours dialog: save, then play the finishing animation */
async function logDone(){
  const h=parseFloat(document.getElementById("lg-h").value),er=document.getElementById("lg-err");
  if(!(h>0)){er.textContent=t("spentReq");er.hidden=false;document.getElementById("lg-h").focus();return}
  const k=tasks.find(x=>x.id===S.dlg.id),back=!!S.dlg.back,u=U(k.to),before=doneWeek(k.to).length;
  const stg=S.dlg.stage||(typeof doneStageOf==="function"&&doneStageOf(k.type)?doneStageOf(k.type).id:"");
  S.dlg=S.dlg.back?{type:"task",id:k.id,focused:true}:null;
  const save=pb.collection("tasks").update(k.id,Object.assign({status:"done",done_at:TODAY,spent:h},stg?{stage:stg}:{}));
  const commit=async()=>{
    try{await save}catch(e){fail(e);await refresh(true);return}
    try{await loadAll()}catch(e){}
    S.bump=k.to===S.me;const hit=k.to===S.me&&before<u.kpi&&before+1>=u.kpi;S.celebrate=hit;render();toast(fill(t(hit?"kpiYay":"loggedToast"),fh(h)));
  };
  if(!back){render();const card=document.querySelector(`.check[data-id="${k.id}"]`)?.closest(".task");
    if(card&&!matchMedia("(prefers-reduced-motion: reduce)").matches){card.classList.add("completing");setTimeout(commit,650);return}}
  commit();
}

    case "nopen":{const n=notifs.find(x=>x.id===id);if(n&&!n.read){n.read=true;pb.collection("notifications").update(id,{read:true}).catch(()=>{})}return}

/* Roles: admin and manager see everyone; a supervisor sees the staff the admin put in their team */
const isMgr=u=>!!u&&(u.role==="admin"||u.role==="manager");
const teamOf=uid=>users.filter(x=>x.active&&(x.supervisors||[]).includes(uid));
/* people this user may give a task to (besides themselves) */
function assignables(){const m=me();if(isTaskMgr(m))return users.filter(u=>u.active&&u.id!==m.id&&u.role!=="admin");if(m.role==="supervisor")return teamOf(m.id);return []}
const STCOLORS=["gray","blue","purple","orange","yellow","pink","teal","navy","green","red"];

const ST=id=>statuses.find(s=>s.id===id),TT=id=>ttypes.find(x=>x.id===id),PO=id=>positions.find(p=>p.id===id);
const nm=o=>o?(S.lang==="km"&&o.name_km?o.name_km:o.name):"";
const sortedSt=()=>statuses.slice().sort((a,b)=>a.sort-b.sort);
function flowOf(typeId){const tp=TT(typeId);return sortedSt().filter(s=>!tp||!tp.statuses.length||tp.statuses.includes(s.id))}
function posOf(uid){const u=U(uid);return u?(u.positions||[]).map(PO).filter(Boolean):[]}
function seesStage(stageId,uid){uid=uid||S.me;const u=U(uid);if(!u)return false;if(u.role==="admin")return true;const ps=posOf(uid);if(!ps.length)return true;return ps.some(p=>p.statuses.includes(stageId))}
function myStages(){return sortedSt().filter(s=>seesStage(s.id))}
function myTypes(){const u=me(),ps=posOf(S.me);if(u.role==="admin"||!ps.length)return ttypes.slice();const ids=new Set(ps.flatMap(p=>p.types));return ttypes.filter(x=>ids.has(x.id))}
const doneStageOf=typeId=>flowOf(typeId).find(s=>s.done)||sortedSt().find(s=>s.done)||null;
function nextStageOf(k){const f=flowOf(k.type),i=f.findIndex(s=>s.id===k.stage);return i>=0?(f[i+1]||null):(f[0]||null)}
function stageChip(k){const s=ST(k.stage);if(!s){const x=stat(k);return `<span class="chip ${x}">${t(x)}</span>`}return `<span class="chip sc-${s.color||"gray"}">${esc(nm(s))}</span>`}

     :`<button class="check" data-act="next" data-id="${k.id}" aria-pressed="false" title="${esc(nx?t("nextStep")+": "+nm(nx):t("lastStep"))}" aria-label="${esc((nx?t("nextStep")+": "+nm(nx):t("lastStep"))+" · "+k.title)}"></button>`}
   <button class="open" data-act="open" data-id="${k.id}"><h3>${esc(k.title)}</h3>
    <span class="meta"><span class="${s==="overdue"?"late":""}">${dueText(k)}</span>
     <span>${showWho?esc(U(k.to).name):(mine?t("own"):t("from")+" "+esc(U(k.by).name))}</span>
     ${k.type&&TT(k.type)?`<span>${esc(nm(TT(k.type)))}</span>`:""}<span class="pr ${k.prio}">${t(k.prio)}</span>${timeMeta(k)}${attCount(k)}${delChip(k)}${k.client?`<span>${esc(C(k.client))}</span>`:""}${k.repeat?`<span>🔁 ${esc(repeatLabel(k))}</span>`:""}${k.comments.length?`<span>${k.comments.length} ${t("comments").toLowerCase()}</span>`:""}</span></button>

function filterBar(){

function kCard(k,team,inOther){

  const opts=flowOf(k.type).filter(x=>x.id!==k.stage);
  const cover=coverOf(k);
  return `<article class="kcard ${s==="overdue"?"isover":""}" draggable="${movable}" data-id="${k.id}">
    ${cover?`<img class="kcover" src="${esc(cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" draggable="false" onerror="this.remove()">`:""}
    <button class="open" data-act="open" data-id="${k.id}"><b>${esc(k.title)}</b>
     <span class="meta"><span class="${s==="overdue"?"late":""}">${dueText(k)}</span>${k.type&&TT(k.type)?`<span>${esc(nm(TT(k.type)))}</span>`:""}<span class="pr ${k.prio}">${t(k.prio)}</span>${k.est?`<span class="num">${fh(k.status==="done"&&k.spent!=null?k.spent:k.est)}</span>`:""}${attCount(k)}${delChip(k)}${k.client?`<span>${esc(C(k.client))}</span>`:""}</span>
     ${team||inOther?`<span class="kwho"><span class="av">${avIn(U(k.to))}</span>${esc(U(k.to).name)}${inOther?" · "+stageChip(k):""}</span>`:""}</button>
    ${movable&&opts.length&&k.status!=="done"?`<select class="kmove" data-x="move" data-id="${k.id}" aria-label="${t("moveTo")} ${esc(k.title)}"><option value="">${t("moveTo")}</option>${opts.map(x=>`<option value="${x.id}">${esc(nm(x))}</option>`).join("")}</select>`:""}
    ${canFinish(k)&&(k.to===S.me||!team)&&ST(k.stage)?`<button class="btn small finishmini" data-act="finish-open" data-id="${k.id}">${fill(t("finishBtn"),esc(nm(ST(k.stage))))} →</button>`:""}
  </article>`;
}
function vKanban(list,team){
  const cols=myStages(),colIds=new Set(cols.map(s=>s.id));
  const other=list.filter(k=>!colIds.has(k.stage));
  const col=s=>{const items=list.filter(k=>k.stage===s.id);
    return `<section class="kcol" data-stage="${s.id}" aria-label="${esc(nm(s))}"><header><span class="kdot sc-${s.color||"gray"}"></span><b>${esc(nm(s))}</b>${s.done?`<span class="cap muted">${t("finishedWeek")}</span>`:""}<span class="kcount num">${items.length}</span></header>
      <div class="kitems">${items.map(k=>kCard(k,team,false)).join("")||`<p class="kempty" aria-hidden="true"></p>`}</div></section>`};
  return `<div class="kboard">${cols.map(col).join("")}
    ${other.length?`<section class="kcol kother"><header><b>${t("otherStages")}</b><span class="kcount num">${other.length}</span></header><p class="cap muted">${t("otherHelp")}</p><div class="kitems">${other.map(k=>kCard(k,team,true)).join("")}</div></section>`:""}</div>`;
}
